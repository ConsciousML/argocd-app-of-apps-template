apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: {{ .Values.name | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: {{ .Values.name | quote }}
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        # Diversify across families/sizes for deeper, cheaper spot pools.
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r", "t"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["2"]
        # Exclude oversized instances so Karpenter never bin-packs onto an
        # expensive instance; nano/micro are too small to be useful.
        - key: karpenter.k8s.aws/instance-size
          operator: NotIn
          values: ["nano", "micro", "metal"]
      taints:
        {{- toYaml .Values.taints | nindent 8 }}
      expireAfter: 720h
  # Safety net to prevent runaway scaling costs. Increase this value if your
  # workloads require more compute capacity.
  limits:
    cpu: 10
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
