name: alertmanager-slack-bot
targetSecretName: alertmanager-slack-bot
# ESO is the sole owner of this secret (unlike argocd-secret), and the source Slack bot token
# can be rotated, so create it and keep polling.
targetCreationPolicy: Owner
refreshPolicy: Periodic
# remoteProperty values here must match the secret_data keys in
# units/eks/addons/prometheus_stack/alertmanager/aws_secret_slack_bot/terragrunt.hcl
# (terragrunt-template-catalog-eks repo).
data:
  - secretKey: bot_token
    remoteProperty: bot_token
  - secretKey: app_url
    remoteProperty: app_url
