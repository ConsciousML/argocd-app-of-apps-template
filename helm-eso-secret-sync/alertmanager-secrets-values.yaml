name: alertmanager-slack-bot
targetSecretName: alertmanager-slack-bot
# ESO is the sole owner of this secret (unlike argocd-secret), and the source Slack bot token
# can be rotated, so create it and keep polling.
targetCreationPolicy: Owner
refreshPolicy: Periodic
# remoteProperty value here must match the secret_data key in
# units/eks/addons/prometheus_stack/alertmanager/aws_secret_slack_bot/terragrunt.hcl
# (terragrunt-template-catalog-eks repo). app_url isn't stored here, Alertmanager's app_url
# field takes a literal string rather than a mounted file, so it's threaded through appParams
# into alertmanager.config.global.slack_app_url instead.
data:
  - secretKey: bot_token
    remoteProperty: bot_token
