apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.name | quote }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshPolicy: {{ .Values.refreshPolicy | default "CreatedOnce" }}
  secretStoreRef:
    name: {{ .Values.secretStoreName | quote }}
    kind: SecretStore
  target:
    name: {{ .Values.targetSecretName | quote }}
    creationPolicy: {{ .Values.targetCreationPolicy | default "Merge" }}
    # Without this, ESO copies this ExternalSecret's own labels/annotations onto the target
    # Secret by default — including ArgoCD's tracking-id, which then makes ArgoCD treat a
    # pre-existing, foreign-owned Secret (e.g. argocd-secret) as one of its managed resources
    # and prune it on cascade delete (catalog repo issue #17).
    template:
      metadata:
        annotations: {}
        labels: {}
  data:
    {{- range .Values.data }}
    - secretKey: {{ .secretKey | quote }}
      remoteRef:
        key: {{ $.Values.remoteKey | quote }}
        property: {{ .remoteProperty | quote }}
    {{- end }}
