karpenter:
  # Placeholder for `helm template` to pass in CI
  settings:
    clusterName: "cluster"
    interruptionQueue: "queue"
    enableZonalShift: false
  controller:
    resources:
      requests:
        cpu: "1"
        memory: "1Gi"
      limits:
        cpu: "1"
        memory: "1Gi"
  # Requires the ServiceMonitor CRD from helm-kube-prometheus-stack, which is why this
  # app syncs after it (see apps/values.yaml).
  serviceMonitor:
    enabled: true
