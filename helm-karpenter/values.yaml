karpenter:
  # Placeholders for `helm template` to pass in CI. At sync time the catalog's app_of_apps
  # unit injects the real clusterName (from the EKS cluster) and interruptionQueue (from
  # units/eks/addons/karpenter/iam) via appParams.
  settings:
    clusterName: "cluster"
    interruptionQueue: "queue"
    enableZonalShift: false
  controller:
    resources:
      requests:
        cpu: "1"
        memory: "1Gi"
      limits:
        cpu: "1"
        memory: "1Gi"
  # Requires the ServiceMonitor CRD from helm-kube-prometheus-stack, which is why this
  # app syncs after it (see apps/values.yaml).
  serviceMonitor:
    enabled: true
