karpenter:
  # Injected by the catalog (terragrunt-template-catalog-eks) via appParams, from the EKS
  # cluster name and units/eks/addons/karpenter/iam's interruption queue. See
  # units/eks/addons/argocd/app_of_apps in that repo.
  settings:
    clusterName: ""
    interruptionQueue: ""
    enableZonalShift: false
  controller:
    resources:
      requests:
        cpu: 49m
        memory: 298M
      limits:
        memory: 298M
  # Requires the ServiceMonitor CRD from helm-kube-prometheus-stack, which is why this
  # app syncs after it (see apps/values.yaml).
  serviceMonitor:
    enabled: true
