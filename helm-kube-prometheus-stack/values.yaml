kube-prometheus-stack:
  # Both set via catalog appParams (units/eks/addons/argocd/app_of_apps/terragrunt.hcl)
  fullnameOverride: "" # also composes the helm-httproute backendRef names, Helm/YAML can't do that string interpolation itself
  environment: ""      # read by alertmanager.config below (via tplConfig) to prefix each Slack channel name

  # Installed by the catalog's prometheus_operator_crds unit ahead of ArgoCD, not this chart,
  # so the ServiceMonitor CRD already exists by first sync instead of only after this app.
  crds:
    enabled: false

  # These control plane components are AWS-managed on EKS and not exposed for scraping
  kubeEtcd: { enabled: false }
  kubeScheduler: { enabled: false }
  kubeControllerManager: { enabled: false }

  # Shared by the config-reloader sidecar in both the prometheus and alertmanager StatefulSets,
  # the chart has no per-instance override. Sized from kubectl top: real usage was 15Mi and 13Mi.
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 11m
        memory: 24M
      limits:
        cpu: 11m
        memory: 24M

  kube-state-metrics:
    resources:
      requests:
        cpu: 11m
        memory: 37M
      limits:
        cpu: 55m
        memory: 37M
    nodeSelector:
      karpenter.sh/nodepool: critical
    tolerations:
      - key: karpenter.sh/workload-class
        operator: Equal
        value: critical
        effect: NoSchedule

  # DaemonSet, one pod per node: needs metrics from every node regardless of pool, so it
  # tolerates both taints instead of pinning to critical via nodeSelector.
  # Karpenter only accounts for a DaemonSet's overhead when a node is first launched, so a
  # DaemonSet pod that needs to land on an already-full node would otherwise stay Pending
  # indefinitely. daemonset-critical (see priority-classes/) lets it preempt a
  # lower-priority pod instead, which turns into a new pending pod that Karpenter will scale
  # up for, without being able to preempt cluster-critical controllers like Karpenter itself
  # or the ArgoCD application-controller to do it.
  prometheus-node-exporter:
    priorityClassName: daemonset-critical
    resources:
      requests:
        cpu: 11m
        memory: 24M
      limits:
        cpu: 55m
        memory: 24M
    tolerations:
      - key: karpenter.sh/workload-class
        operator: Exists
        effect: NoSchedule
      - key: node-role/mng
        operator: Equal
        value: "true"
        effect: NoSchedule

  prometheusOperator:
    resources:
      requests:
        cpu: 11m
        memory: 37M
      limits:
        cpu: 11m
        memory: 37M
    nodeSelector:
      karpenter.sh/nodepool: critical
    tolerations:
      - key: karpenter.sh/workload-class
        operator: Equal
        value: critical
        effect: NoSchedule
    admissionWebhooks:
      # The admission-create/admission-patch hook Jobs don't inherit prometheusOperator's own
      # nodeSelector/tolerations above, they need their own or they're unschedulable.
      patch:
        nodeSelector:
          karpenter.sh/nodepool: critical
        tolerations:
          - key: karpenter.sh/workload-class
            operator: Equal
            value: critical
            effect: NoSchedule

  defaultRules:
    # Drives the Slack routing tree below (each component gets its own set of channels).
    # general holds TargetDown, Watchdog, and InfoInhibitor. Labeling it component: k8s routes
    # TargetDown to k8s-warning/critical (a target going unscrapeable is a cluster-health signal).
    # Watchdog is still isolated by an alertname matcher evaluated before the component routes,
    # and InfoInhibitor's severity: none is still caught by the info/none route before it, so
    # this label only actually changes where TargetDown lands.
    additionalRuleGroupLabels:
      general: { component: k8s }
      alertmanager: { component: prometheus-stack }
      configReloaders: { component: prometheus-stack }
      prometheus: { component: prometheus-stack }
      prometheusOperator: { component: prometheus-stack }
      k8sContainerCpuUsageSecondsTotal: { component: k8s }
      k8sContainerMemoryCache: { component: k8s }
      k8sContainerMemoryRss: { component: k8s }
      k8sContainerMemorySwap: { component: k8s }
      k8sContainerMemoryWorkingSetBytes: { component: k8s }
      k8sContainerResource: { component: k8s }
      k8sPodOwner: { component: k8s }
      kubeApiserverAvailability: { component: k8s }
      kubeApiserverBurnrate: { component: k8s }
      kubeApiserverHistogram: { component: k8s }
      kubeApiserverSlos: { component: k8s }
      kubePrometheusGeneral: { component: k8s }
      kubePrometheusNodeRecording: { component: k8s }
      kubeStateMetrics: { component: k8s }
      kubelet: { component: k8s }
      kubernetesApps: { component: k8s }
      kubernetesResources: { component: k8s }
      kubernetesStorage: { component: k8s }
      kubernetesSystem: { component: k8s }
      kubeProxy: { component: k8s }
      nodeExporterRecording: { component: k8s }
      nodeExporterAlerting: { component: k8s }
      network: { component: k8s }
      node: { component: k8s }

  prometheus:
    service:
      # Without this the Service round-robins per request across replicas that scrape
      # independently and can briefly hold different data, so graphs jump on refresh.
      # https://prometheus-operator.dev/docs/platform/high-availability/
      sessionAffinity: ClientIP

    prometheusSpec:
      # 2 independent replicas, each with their own PVC below. No shared storage needed,
      # Prometheus HA doesn't require it (dedup happens on the query/Grafana side).
      replicas: 2

      # Hard, not the chart's soft default: the critical NodePool can launch a second spot
      # node on demand, so a real guarantee against sharing a node is safe here.
      podAntiAffinity: hard

      # Spreads replicas across AZs. A replica stuck Pending on
      # DoNotSchedule doesn't take Prometheus down, the other replica keeps serving, so the
      # stronger guarantee is worth the risk over ScheduleAnyway.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          additionalLabelSelectors: OnResource

      # During disruption, always keep 1 replica up
      podDisruptionBudget:
        enabled: true
        minAvailable: 1

      # Scrape any ServiceMonitor/PodMonitor in the cluster regardless of labels, and load any
      # PrometheusRule regardless of labels, so other addons can opt into scraping/alerting
      # just by enabling their chart's serviceMonitor/PrometheusRule.
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false

      # Goldilocks/VPA can't produce a recommendation for this StatefulSet (prometheus-operator
      # owns it, VPA won't target a StatefulSet with a non-scalable parent controller), sized
      # from kubectl top instead
      resources:
        requests:
          cpu: 93m
          memory: 1039M
        limits:
          memory: 1039M

      nodeSelector:
        karpenter.sh/nodepool: critical
      tolerations:
        - key: karpenter.sh/workload-class
          operator: Equal
          value: critical
          effect: NoSchedule

      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: gp3
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 50Gi
      # DEV: reclaim volumes for cost savings, do not enable this on prod. See
      # https://github.com/ConsciousML/terragrunt-template-live-eks/issues/38 for details.
      persistentVolumeClaimRetentionPolicy:
        whenDeleted: Delete
        whenScaled: Retain

  alertmanager:
    alertmanagerSpec:
      # Same VPA limitation as prometheus above, sized from kubectl top instead: real usage
      # was 21Mi.
      resources:
        requests:
          cpu: 11m
          memory: 36M
        limits:
          cpu: 11m
          memory: 36M
      nodeSelector:
        karpenter.sh/nodepool: critical
      tolerations:
        - key: karpenter.sh/workload-class
          operator: Equal
          value: critical
          effect: NoSchedule
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: gp3
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 10Gi
      # DEV: reclaim volumes for cost savings, do not enable this on prod. See
      # https://github.com/ConsciousML/terragrunt-template-live-eks/issues/38 for details.
      persistentVolumeClaimRetentionPolicy:
        whenDeleted: Delete
        whenScaled: Retain

      # Name must match targetSecretName in helm-eso-secret-sync/alertmanager-secrets-values.yaml.
      # The Prometheus Operator mounts each key of this Secret as a file under
      # /etc/alertmanager/secrets/alertmanager-slack-bot/, which config.global.http_config below
      # points at.
      secrets:
        - alertmanager-slack-bot

    # Renders config through Helm's tpl before writing the alertmanager secret, so the
    # "{{ .Values.environment }}-" prefix on each receiver's channel below resolves.
    tplConfig: true

    # Unlike config above, the chart writes templateFiles straight to the secret without
    # running Helm's tpl on it. So the {{ }} below is Alertmanager's own template syntax,
    # evaluated later at notification-send time, not Helm's, and needs no escaping here.
    #
    # Overrides Alertmanager's built-in slack.default.title and slack.default.text template
    # names (see https://github.com/prometheus/alertmanager/blob/main/template/default.tmpl),
    # so every slack_config below picks up this formatting without overriding either template
    # itself. Upstream's slack.default.text renders empty, which is why a Slack notification
    # would otherwise show only a bare title with no body.
    templateFiles:
      slack.tmpl: |-
        {{ define "slack.default.title" }}[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})
        {{ end }}
        {{ define "slack.default.text" }}
        {{ range .Alerts }}*{{ .Annotations.summary }}*
        {{ .Annotations.description }}
        {{ end }}
        {{ end }}

    # Flat routes, evaluated top to bottom, first match wins (continue defaults to false).
    # component comes from defaultRules.additionalRuleGroupLabels above. Watchdog isn't a
    # component, it's isolated by alertname, and must be matched before the info/none catch-all
    # since Watchdog itself fires at severity: none. Anything matching none of these (missing or
    # unexpected component/severity) falls to the top-level "unrouted" receiver instead of
    # silently mixing into prometheus-stack-warning, so a gap in this routing tree is visible.
    config:
      global:
        # Bot token auth (https://prometheus.io/docs/alerting/latest/configuration/#slack_config):
        # slack_api_url is this literal chat.postMessage endpoint, not a webhook URL, and the
        # bot token is passed as a Bearer credential via the generic http_config.authorization
        # block, not the app_token/app_token_file fields (a separate mechanism, mutually
        # exclusive with setting api_url directly). Every slack_config below inherits both from
        # these global defaults instead of repeating them per receiver.
        slack_api_url: https://slack.com/api/chat.postMessage
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/secrets/alertmanager-slack-bot/bot_token
      route:
        receiver: "unrouted"
        routes:
          - receiver: "watchdog"
            matchers:
              - alertname = "Watchdog"
          - receiver: "null"
            matchers:
              - severity =~ "info|none"
          - receiver: "k8s-critical"
            matchers:
              - component = "k8s"
              - severity = "critical"
          - receiver: "k8s-warning"
            matchers:
              - component = "k8s"
              - severity = "warning"
          - receiver: "prometheus-stack-critical"
            matchers:
              - component = "prometheus-stack"
              - severity = "critical"
          - receiver: "prometheus-stack-warning"
            matchers:
              - component = "prometheus-stack"
              - severity = "warning"
          - receiver: "loki-critical"
            matchers:
              - component = "loki"
              - severity = "critical"
          - receiver: "loki-warning"
            matchers:
              - component = "loki"
              - severity = "warning"
          - receiver: "argocd-critical"
            matchers:
              - component = "argocd"
              - severity = "critical"
          - receiver: "argocd-warning"
            matchers:
              - component = "argocd"
              - severity = "warning"
          - receiver: "uptime-critical"
            matchers:
              - component = "uptime"
              - severity = "critical"
          - receiver: "uptime-warning"
            matchers:
              - component = "uptime"
              - severity = "warning"
      receivers:
        - name: "null"
        - name: "unrouted"
          slack_configs:
            - channel: "#{{ .Values.environment }}-unrouted"
              send_resolved: true
        - name: "watchdog"
          slack_configs:
            - channel: "#{{ .Values.environment }}-watchdog"
              send_resolved: true
        - name: "k8s-critical"
          slack_configs:
            - channel: "#{{ .Values.environment }}-k8s-critical"
              send_resolved: true
        - name: "k8s-warning"
          slack_configs:
            - channel: "#{{ .Values.environment }}-k8s-warning"
              send_resolved: true
        - name: "prometheus-stack-critical"
          slack_configs:
            - channel: "#{{ .Values.environment }}-prometheus-stack-critical"
              send_resolved: true
        - name: "prometheus-stack-warning"
          slack_configs:
            - channel: "#{{ .Values.environment }}-prometheus-stack-warning"
              send_resolved: true
        - name: "loki-critical"
          slack_configs:
            - channel: "#{{ .Values.environment }}-loki-critical"
              send_resolved: true
        - name: "loki-warning"
          slack_configs:
            - channel: "#{{ .Values.environment }}-loki-warning"
              send_resolved: true
        - name: "argocd-critical"
          slack_configs:
            - channel: "#{{ .Values.environment }}-argocd-critical"
              send_resolved: true
        - name: "argocd-warning"
          slack_configs:
            - channel: "#{{ .Values.environment }}-argocd-warning"
              send_resolved: true
        - name: "uptime-critical"
          slack_configs:
            - channel: "#{{ .Values.environment }}-uptime-critical"
              send_resolved: true
        - name: "uptime-warning"
          slack_configs:
            - channel: "#{{ .Values.environment }}-uptime-warning"
              send_resolved: true

  grafana:
    # Dashboards and datasources are sidecar-provisioned from ConfigMaps, nothing to persist
    persistence:
      enabled: false

    resources:
      requests:
        cpu: 23m
        memory: 381M
      limits:
        cpu: 115m
        memory: 381M

    nodeSelector:
      karpenter.sh/nodepool: critical
    tolerations:
      - key: karpenter.sh/workload-class
        operator: Equal
        value: critical
        effect: NoSchedule

    downloadDashboards:
      securityContext:
        readOnlyRootFilesystem: true # writes only into the already-mounted storage emptyDir

    sidecar:
      # Shared by both the dashboards and datasources sidecar containers, the chart has no
      # per-container override.
      resources:
        requests:
          cpu: 35m
          memory: 249M
        limits:
          cpu: 175m
          memory: 249M
      securityContext:
        readOnlyRootFilesystem: true # writes only into the already-mounted provisioning emptyDirs
      # Setting env.GF_SECURITY_ADMIN_USER below stops the chart from auto-injecting
      # REQ_USERNAME into the sidecars (see the grafana chart's _pod.tpl), so their
      # provisioning-reload API calls go out with no username and always get 401'd. Without a
      # successful reload, any dashboard/datasource ConfigMap picked up after Grafana's own
      # boot-time provisioning scan is silently never loaded until the pod restarts and wins
      # the sidecar-vs-grafana startup race by luck.
      dashboards:
        env:
          REQ_USERNAME: admin
      datasources:
        env:
          REQ_USERNAME: admin

    # Appends to the chart's auto-provisioned Prometheus/Alertmanager datasources.
    additionalDataSources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki-gateway.loki.svc.cluster.local:80
        isDefault: false # keep Prometheus (chart default) as the org default
        editable: false
        jsonData:
          maxLines: 1000
          timeout: 60

    # Addon dashboards, provisioned via the Grafana chart's dashboard import
    # (https://github.com/grafana-community/helm-charts/blob/main/charts/grafana/README.md#import-dashboards).
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: karpenter
            orgId: 1
            folder: Karpenter
            type: file
            options:
              path: /var/lib/grafana/dashboards/karpenter
          - name: external-dns
            orgId: 1
            folder: External DNS
            type: file
            options:
              path: /var/lib/grafana/dashboards/external-dns
          - name: aws-lbc
            orgId: 1
            folder: AWS Load Balancer Controller
            type: file
            options:
              path: /var/lib/grafana/dashboards/aws-lbc
          - name: eso
            orgId: 1
            folder: External Secrets Operator
            type: file
            options:
              path: /var/lib/grafana/dashboards/eso
          - name: argocd
            orgId: 1
            folder: ArgoCD
            type: file
            options:
              path: /var/lib/grafana/dashboards/argocd
          - name: loki
            orgId: 1
            folder: Loki
            type: file
            options:
              path: /var/lib/grafana/dashboards/loki
          - name: blackbox-exporter
            orgId: 1
            folder: Blackbox Exporter
            type: file
            options:
              path: /var/lib/grafana/dashboards/blackbox-exporter
    dashboards:
      # https://karpenter.sh/docs/getting-started/getting-started-with-karpenter/#monitoring-with-grafana-optional
      karpenter:
        capacity-dashboard:
          url: https://karpenter.sh/preview/getting-started/getting-started-with-karpenter/karpenter-capacity-dashboard.json
        performance-dashboard:
          url: https://karpenter.sh/preview/getting-started/getting-started-with-karpenter/karpenter-performance-dashboard.json
      # https://grafana.com/grafana/dashboards/23969-external-dns/
      external-dns:
        external-dns-dashboard:
          gnetId: 23969
          revision: 1
      # https://grafana.com/grafana/dashboards/18319-aws-load-balancer-controller/
      aws-lbc:
        aws-lbc-dashboard:
          gnetId: 18319
          revision: 2
          datasource:
            - { name: DS_PROMETHEUS, value: Prometheus }
      # https://grafana.com/grafana/dashboards/21640-external-secrets/
      eso:
        eso-dashboard:
          gnetId: 21640
          revision: 4
          datasource:
            - { name: DS_METRICS, value: Prometheus }
      # https://github.com/adinhodovic/argo-cd-mixin
      argocd:
        operational-overview:
          gnetId: 19993
          revision: 7
        application-overview:
          gnetId: 19974
          revision: 6
        notifications-overview:
          gnetId: 19975
          revision: 8
      # https://grafana.com/grafana/dashboards/17781-loki-metrics-dashboard/
      loki:
        loki-metrics-dashboard:
          gnetId: 17781
          revision: 1
          datasource:
            - { name: DS_PROMETHEUS, value: Prometheus }
      # https://grafana.com/grafana/dashboards/14928-prometheus-blackbox-exporter/
      blackbox-exporter:
        blackbox-exporter-dashboard:
          gnetId: 14928
          revision: 6
          datasource:
            - { name: DS_PROMETHEUS, value: Prometheus }
    # Placeholders for `helm template` to pass in CI. Overridden at sync time by appParams
    # (see the catalog's app_of_apps unit), which is also the single source of truth shared
    # with grafana-secrets' targetSecretName/secretKey.
    admin:
      existingSecret: ""
      passwordKey: ""
    env:
      GF_SECURITY_ADMIN_USER: admin
