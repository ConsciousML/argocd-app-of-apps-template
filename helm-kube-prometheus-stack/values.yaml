kube-prometheus-stack:
  # Set via catalog appParams (local.kube_prometheus_stack_release in
  # units/eks/addons/argocd/app_of_apps/terragrunt.hcl), which also composes the
  # helm-httproute backendRef names from the same literal — Helm/YAML can't do that string
  # interpolation itself, so this one value is coordinated from the catalog instead.
  fullnameOverride: ""

  # These control plane components are AWS-managed on EKS and not exposed for scraping
  kubeEtcd: { enabled: false }
  kubeScheduler: { enabled: false }
  kubeControllerManager: { enabled: false }

  defaultRules:
    disabled:
      # This node group intentionally runs 2 nodes; the rule can't tell EKS has no
      # control-plane node label and treats <3 nodes as always failing N+1 tolerance.
      # Dev-only: do not carry this disable over to staging/prod environments, where
      # N+1 node failure tolerance is a real concern the alert should keep catching.
      KubeCPUOvercommit: true

  prometheus:
    prometheusSpec:
      # Scrape any ServiceMonitor/PodMonitor in the cluster regardless of labels, so
      # other addons can opt into scraping just by enabling their chart's serviceMonitor
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false

      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: gp3
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 50Gi
      # Reclaim volumes on dev for cost savings, do not enable this on prod
      persistentVolumeClaimRetentionPolicy:
        whenDeleted: Delete
        whenScaled: Retain

  alertmanager:
    alertmanagerSpec:
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: gp3
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 10Gi
      # Reclaim volumes on dev for cost savings, do not enable this on prod
      persistentVolumeClaimRetentionPolicy:
        whenDeleted: Delete
        whenScaled: Retain

  grafana:
    # Dashboards/datasources are sidecar-provisioned from ConfigMaps, nothing to persist
    persistence:
      enabled: false

    # Addon dashboards, provisioned via the Grafana chart's dashboard import
    # (https://github.com/grafana-community/helm-charts/blob/main/charts/grafana/README.md#import-dashboards).
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: karpenter
            orgId: 1
            folder: Karpenter
            type: file
            options:
              path: /var/lib/grafana/dashboards/karpenter
          - name: external-dns
            orgId: 1
            folder: External DNS
            type: file
            options:
              path: /var/lib/grafana/dashboards/external-dns
    dashboards:
      # https://karpenter.sh/docs/getting-started/getting-started-with-karpenter/#monitoring-with-grafana-optional
      karpenter:
        capacity-dashboard:
          url: https://karpenter.sh/preview/getting-started/getting-started-with-karpenter/karpenter-capacity-dashboard.json
        performance-dashboard:
          url: https://karpenter.sh/preview/getting-started/getting-started-with-karpenter/karpenter-performance-dashboard.json
      # https://grafana.com/grafana/dashboards/23969-external-dns/
      external-dns:
        external-dns-dashboard:
          gnetId: 23969
          revision: 1
    # Placeholders for `helm template` to pass in CI. Overridden at sync time by appParams
    # (see the catalog's app_of_apps unit), which is also the single source of truth shared
    # with grafana-secrets' targetSecretName/secretKey.
    admin:
      existingSecret: ""
      passwordKey: ""
    env:
      GF_SECURITY_ADMIN_USER: admin
