apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nested-app-aws-lbc-gateway-api-crds
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://github.com/kubernetes-sigs/aws-load-balancer-controller
    path: config/crd/gateway
    targetRevision: v3.2.1
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: false
      selfHeal: true
