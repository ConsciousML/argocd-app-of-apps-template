{{- range .Values.applications }}
{{- $config := $.Values.config -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .name | quote }}
  namespace: {{ .namespace | default "argocd" }}
  {{- if hasKey . "syncWave" }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .syncWave | quote }}
  {{- end }}
  {{- if not .preventCascadeDelete }}
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  {{- range .finalizers }}
  - {{ . }}
  {{- end }}
  {{- end }}
spec:
  destination:
    namespace: {{ (.destination).namespace | default .name | quote }}
    server: {{ $config.spec.destination.server | quote }}
  project: {{ .project | default "default" }}
  {{- $appParamsValues := index $.Values.appParams .name }}
  {{- $toolHelm := (.tool).helm }}
  {{- if .extraValueFiles }}
  sources:
    - path: {{ .path | default .name | quote }}
      repoURL: {{ $config.spec.source.repoURL }}
      targetRevision: {{ $config.spec.source.targetRevision }}
      helm:
        valueFiles:
          {{- range .extraValueFiles }}
          - $values/{{ . }}
          {{- end }}
        {{- with $toolHelm }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $appParamsValues }}
        values: |
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- with omit (.tool | default dict) "helm" }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
    - repoURL: {{ $config.spec.source.repoURL }}
      targetRevision: {{ $config.spec.source.targetRevision }}
      ref: values
  {{- else }}
  source:
    path: {{ .path | default .name | quote }}
    repoURL: {{ $config.spec.source.repoURL }}
    targetRevision: {{ $config.spec.source.targetRevision }}
    {{- if or $appParamsValues $toolHelm }}
    helm:
      {{- with $toolHelm }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with $appParamsValues }}
      values: |
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
    {{- with omit (.tool | default dict) "helm" }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
  syncPolicy:
    syncOptions:
      # Namespaces are created explicitly by namespace-pod-security-admission, with PSA
      # labels. A missing one should fail sync loudly instead of getting silently created
      # unlabeled (and therefore privileged) here.
      - CreateNamespace=false
      {{- range .syncOptions }}
      - {{ . }}
      {{- end }}
    automated:
      prune: {{ not .preventCascadeDelete }}
      selfHeal: true
---
{{ end -}}
