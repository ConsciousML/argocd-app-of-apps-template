{{- range .Values.applications }}
{{- $config := $.Values.config -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .name | quote }}
  namespace: {{ .namespace | default "argocd" }}
  {{- if hasKey . "syncWave" }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .syncWave | quote }}
  {{- end }}
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: {{ (.destination).namespace | default .name | quote }}
    server: {{ $config.spec.destination.server | quote }}
  project: {{ .project | default "default" }}
  source:
    path: {{ .path | default .name | quote }}
    repoURL: {{ $config.spec.source.repoURL }}
    targetRevision: {{ $config.spec.source.targetRevision }}
    {{- $appParamsValues := index $.Values.appParams .name }}
    {{- $toolHelm := (.tool).helm }}
    {{- if or $appParamsValues $toolHelm }}
    helm:
      {{- with $toolHelm }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with $appParamsValues }}
      values: |
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
    {{- with omit (.tool | default dict) "helm" }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
---
{{ end -}}
