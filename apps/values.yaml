config:
  spec:
    destination:
      server: https://kubernetes.default.svc
    source:
      repoURL: https://github.com/ConsciousML/argocd-app-of-apps-template
      targetRevision: main

appParams: {}

applications:
  # --- Gateway API ---
  - name: crds-gateway-api
    destination:
      namespace: argocd
    syncWave: -1
  - name: crds-aws-lbc-gateway-api
    destination:
      namespace: argocd
    syncWave: -1

  # --- AWS Load Balancer Controller ---
  - name: helm-aws-lbc
    destination:
      namespace: kube-system
    syncWave: 0
    # Chart bundles its own CRDs; avoids client-side apply's annotation size limit.
    syncOptions:
      - ServerSideApply=true
    tool:
      helm:
        # Must match the catalog's Pod Identity association's expected ServiceAccount name.
        releaseName: aws-load-balancer-controller

  # --- ExternalDNS ---
  - name: helm-external-dns-private
    destination:
      namespace: external-dns
    syncWave: 0
    syncOptions:
      - ServerSideApply=true
    tool:
      helm:
        # Must match the catalog's Pod Identity association's expected ServiceAccount name.
        releaseName: external-dns-private
  - name: helm-external-dns-public
    destination:
      namespace: external-dns
    syncWave: 0
    syncOptions:
      - ServerSideApply=true
    tool:
      helm:
        # Must match the catalog's Pod Identity association's expected ServiceAccount name.
        releaseName: external-dns-public

  # --- External Secrets Operator ---
  - name: helm-external-secrets-operator
    destination:
      namespace: external-secrets
    syncWave: 0
    syncOptions:
      - ServerSideApply=true
    tool:
      helm:
        # Must match the catalog's Pod Identity association's expected ServiceAccount name.
        releaseName: external-secrets

  # --- ArgoCD ---
  - name: argocd-secrets
    path: helm-eso-secret-sync
    destination:
      namespace: argocd
    syncWave: 1
  - name: helm-argocd-ingress
    destination:
      namespace: argocd
    syncWave: 1

  # --- Tailscale ---
  - name: tailscale-secrets
    path: helm-eso-secret-sync
    destination:
      namespace: tailscale
    syncWave: -1
  - name: helm-tailscale-operator
    destination:
      namespace: tailscale
    syncWave: 0
    # Chart bundles its own CRDs; avoids client-side apply's annotation size limit.
    syncOptions:
      - ServerSideApply=true
  - name: helm-tailscale-connector
    destination:
      namespace: tailscale
    syncWave: 1

  # --- Guestbook ---
  - name: helm-guestbook
    destination:
      namespace: guestbook
    syncWave: 1
