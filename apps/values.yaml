config:
  spec:
    destination:
      server: https://kubernetes.default.svc
    source:
      repoURL: https://github.com/ConsciousML/argocd-app-of-apps-template
      targetRevision: main

appParams: {}

applications:
  # --- Namespace Pod Security Admission ---
  # Owns Namespace resources: pruning or cascade-deleting this app must never delete one,
  # that would wipe out everything inside it, including argocd's own namespace.
  - name: namespace-pod-security-admission
    path: manifests/namespace-pod-security-admission
    destination:
      namespace: kube-system
    syncWave: -1
    preventCascadeDelete: true

  # --- Network Policies ---
  - name: network-policies-cluster-wide
    path: charts/cluster-network-policies
    destination:
      namespace: kube-system
    syncWave: -1

  # --- EBS CSI Driver ---
  - name: storage-class-gp3
    path: manifests/storage-class-gp3
    destination:
      namespace: kube-system
    syncWave: -1

  # --- Priority Classes ---
  - name: priority-classes
    path: manifests/priority-classes
    destination:
      namespace: kube-system
    syncWave: -1

  # --- DaemonSets Priority ---
  # loki, alloy, kube-prometheus-stack, and cilium carry the cluster's DaemonSets: Alloy
  # itself, Loki's lokiCanary, kube-prometheus-stack's node-exporter, and cilium-agent.
  # Karpenter only sizes a new node for a DaemonSet it already knows about, so a DaemonSet
  # that syncs after another app has already triggered a node launch can land Pending and
  # rely on daemonset-critical preemption to fit instead. Every app marked "See DaemonSets
  # Priority above" is held to wave 3 or later for this reason, on top of whatever real
  # dependencies it has.

  # --- Gateway API ---
  - name: crds-gateway-api
    path: manifests/crds/gateway-api
    destination:
      namespace: argocd
    syncWave: -1
  - name: crds-aws-lbc-gateway-api
    path: manifests/crds/aws-lbc-gateway-api
    destination:
      namespace: argocd
    syncWave: -1
  # Depends on:
  # - crds-gateway-api (GatewayClass CRD)
  # - aws-lbc (the controller sets GatewayClass's Accepted condition, which its health
  #   check waits on)
  # - See DaemonSets Priority above.
  - name: gateway-class
    path: charts/gateway-api/gateway-class
    destination:
      namespace: gateway
    syncWave: 4
  # Depends on:
  # - gateway-class
  # - crds-aws-lbc-gateway-api (LoadBalancerConfiguration/TargetGroupConfiguration CRDs)
  # - aws-lbc (controller reconciles into an ALB)
  # - See DaemonSets Priority above.
  - name: gateway-public
    path: charts/gateway-api/gateway
    destination:
      namespace: gateway
    syncWave: 5
    extraValueFiles:
      - charts/gateway-api/gateway-class/values.yaml
      - charts/gateway-api/gateway/public-gateway-values.yaml
  # Same dependencies as gateway-public.
  - name: gateway-private
    path: charts/gateway-api/gateway
    destination:
      namespace: gateway
    syncWave: 5
    extraValueFiles:
      - charts/gateway-api/gateway-class/values.yaml
      - charts/gateway-api/gateway/private-gateway-values.yaml

  # --- AWS Load Balancer Controller ---
  # Depends on:
  # - See DaemonSets Priority above.
  - name: aws-lbc
    path: charts/aws-lbc
    destination:
      namespace: kube-system
    syncWave: 3
    # Chart bundles its own CRDs; avoids client-side apply's annotation size limit.
    syncOptions:
      - ServerSideApply=true
    tool:
      helm:
        # Must match the catalog's Pod Identity association's expected ServiceAccount name.
        releaseName: aws-load-balancer-controller

  # --- Cilium / Hubble ---
  # CNI chaining mode alongside vpc-cni for Hubble flow visibility, no change to vpc-cni behavior.
  # No hard dependency: synced as early as possible so cilium-agent (a DaemonSet) is known to
  # Karpenter before other apps trigger node launches. See DaemonSets Priority above.
  - name: cilium
    path: charts/cilium
    destination:
      namespace: kube-system
    syncWave: 0
    # Chart bundles its own CRDs and needs ServerSideApply for the annotation size limit.
    syncOptions:
      - ServerSideApply=true
  # Depends on:
  # - gateway-private
  # - cilium (the hubble-ui backend Service)
  - name: hubble-ui-httproute
    path: charts/gateway-api/httproute
    destination:
      namespace: kube-system
    syncWave: 6
    extraValueFiles:
      - charts/gateway-api/gateway/private-gateway-values.yaml
      - charts/gateway-api/httproute/hubble-ui-httproute-values.yaml

  # Karpenter (controller, EC2NodeClass, and both NodePools) is entirely Terraform-managed,
  # applied before app-of-apps ever syncs. See units/eks/addons/karpenter in the catalog repo.

  # --- ExternalDNS ---
  # Depends on:
  # - crds-gateway-api (watches gateway-httproute sources)
  # - See DaemonSets Priority above.
  - name: external-dns-private
    path: charts/external-dns
    destination:
      namespace: external-dns
    syncWave: 3
    syncOptions:
      - ServerSideApply=true
    tool:
      helm:
        # Must match the catalog's Pod Identity association's expected ServiceAccount name.
        releaseName: external-dns-private
    extraValueFiles:
      - charts/external-dns/external-dns-private-values.yaml
    # ArgoCD auto-adds these for the PreDelete hook in predelete-hook.yaml; declared here so sync doesn't flap.
    finalizers:
      - pre-delete-finalizer.argocd.argoproj.io
      - pre-delete-finalizer.argocd.argoproj.io/cleanup
  # Same dependencies as external-dns-private.
  - name: external-dns-public
    path: charts/external-dns
    destination:
      namespace: external-dns
    syncWave: 3
    syncOptions:
      - ServerSideApply=true
    tool:
      helm:
        # Must match the catalog's Pod Identity association's expected ServiceAccount name.
        releaseName: external-dns-public
    extraValueFiles:
      - charts/external-dns/external-dns-public-values.yaml
    finalizers:
      - pre-delete-finalizer.argocd.argoproj.io
      - pre-delete-finalizer.argocd.argoproj.io/cleanup

  # --- External Secrets Operator ---
  - name: external-secrets-operator
    path: charts/external-secrets-operator/operator
    destination:
      namespace: external-secrets
    syncWave: 0
    syncOptions:
      - ServerSideApply=true
    tool:
      helm:
        # Must match the catalog's Pod Identity association's expected ServiceAccount name.
        releaseName: external-secrets

  # --- Loki ---
  - name: loki
    path: charts/monitoring/loki
    destination:
      namespace: loki
    syncWave: 0
    tool:
      helm:
        # Must match the catalog's Pod Identity association's expected ServiceAccount name.
        releaseName: loki

  # --- Alloy ---
  # No hard dependency on loki: it pushes logs to loki-gateway.loki but retries on
  # write failure, so it doesn't need Loki up first. Synced in the same wave as Loki so both
  # DaemonSets (Alloy itself, Loki's lokiCanary) exist as early as possible. See DaemonSets
  # Priority above.
  - name: alloy
    path: charts/monitoring/alloy
    destination:
      namespace: loki
    syncWave: 0
    tool:
      helm:
        releaseName: alloy

  # --- Blackbox Exporter ---
  # No hard dependency: ServiceMonitor/PrometheusRule CRDs are Terraform-managed, applied
  # before ArgoCD ever syncs.
  - name: blackbox-exporter
    path: charts/monitoring/blackbox-exporter
    destination:
      namespace: monitoring
    syncWave: 2

  # --- Prometheus Rules ---
  - name: prometheus-rules
    path: charts/monitoring/prometheus-rules
    destination:
      namespace: monitoring
    syncWave: 0
  # Depends on external-secrets-operator.
  - name: argocd-secrets
    path: charts/external-secrets-operator/secret-sync
    destination:
      namespace: argocd
    syncWave: 1
    extraValueFiles:
      - charts/external-secrets-operator/secret-sync/argocd-secrets-values.yaml
  # Depends on:
  # - aws-lbc
  - name: argocd-server-grpc-service
    path: manifests/argocd-server-grpc-service
    destination:
      namespace: argocd
    syncWave: 6
  # Depends on:
  # - argocd-server-grpc-service (backendRefs must exist first)
  # - gateway-private
  - name: argocd-httproute
    path: charts/gateway-api/httproute
    destination:
      namespace: argocd
    syncWave: 7
    extraValueFiles:
      - charts/gateway-api/gateway/private-gateway-values.yaml
      - charts/gateway-api/httproute/argocd-httproute-values.yaml

  # --- Tailscale ---
  # Depends on external-secrets-operator.
  - name: tailscale-secrets
    path: charts/external-secrets-operator/secret-sync
    destination:
      namespace: tailscale
    syncWave: 1
    extraValueFiles:
      - charts/external-secrets-operator/secret-sync/tailscale-secrets-values.yaml
  # Depends on:
  # - tailscale-secrets (needs the oauth secret before it can register with Tailscale)
  # - See DaemonSets Priority above.
  - name: tailscale-operator
    path: charts/tailscale/operator
    destination:
      namespace: tailscale
    syncWave: 3
    # Chart bundles its own CRDs; avoids client-side apply's annotation size limit.
    syncOptions:
      - ServerSideApply=true
  # Depends on tailscale-operator (controller and its CRDs).
  - name: tailscale-connector
    path: charts/tailscale/connector
    destination:
      namespace: tailscale
    syncWave: 4

  # --- Prometheus stack ---
  # Depends on external-secrets-operator.
  - name: grafana-secrets
    path: charts/external-secrets-operator/secret-sync
    destination:
      namespace: monitoring
    syncWave: 1
    extraValueFiles:
      - charts/external-secrets-operator/secret-sync/grafana-secrets-values.yaml
  # Depends on external-secrets-operator.
  - name: alertmanager-secrets
    path: charts/external-secrets-operator/secret-sync
    destination:
      namespace: monitoring
    syncWave: 1
    extraValueFiles:
      - charts/external-secrets-operator/secret-sync/alertmanager-secrets-values.yaml
  # Depends on:
  # - grafana-secrets (needs the admin secret before Grafana's first boot)
  # - alertmanager-secrets (Alertmanager mounts it via alertmanagerSpec.secrets, so it must
  #   exist before the pod can start)
  - name: kube-prometheus-stack
    path: charts/monitoring/kube-prometheus-stack
    destination:
      namespace: monitoring
    syncWave: 2
    # Avoids client-side apply's annotation size limit on this release's larger resources
    # (e.g. the bundled default PrometheusRules).
    syncOptions:
      - ServerSideApply=true
    tool:
      helm:
        # fullnameOverride only pins this chart's own resources (prometheus/alertmanager/
        # operator); bundled subcharts (grafana, kube-state-metrics, node-exporter) derive
        # their own names from the release name instead, which backendRefs rely on. Must
        # match the catalog's local.kube_prometheus_stack_release (units/eks/addons/argocd/
        # app_of_apps/terragrunt.hcl in terragrunt-template-catalog-eks).
        releaseName: kube-prometheus-stack
    extraValueFiles:
      - charts/external-secrets-operator/secret-sync/grafana-secrets-values.yaml
  # Depends on:
  # - gateway-private
  # - kube-prometheus-stack (the backend Service)
  - name: grafana-httproute
    path: charts/gateway-api/httproute
    destination:
      namespace: monitoring
    syncWave: 6
    extraValueFiles:
      - charts/gateway-api/gateway/private-gateway-values.yaml
      - charts/gateway-api/httproute/grafana-httproute-values.yaml
  # Same dependencies as grafana-httproute.
  - name: prometheus-httproute
    path: charts/gateway-api/httproute
    destination:
      namespace: monitoring
    syncWave: 6
    extraValueFiles:
      - charts/gateway-api/gateway/private-gateway-values.yaml
      - charts/gateway-api/httproute/prometheus-httproute-values.yaml
  # Same dependencies as grafana-httproute.
  - name: alertmanager-httproute
    path: charts/gateway-api/httproute
    destination:
      namespace: monitoring
    syncWave: 6
    extraValueFiles:
      - charts/gateway-api/gateway/private-gateway-values.yaml
      - charts/gateway-api/httproute/alertmanager-httproute-values.yaml

  # --- VPA (recommender only) ---
  # Depends on:
  # - See DaemonSets Priority above.
  # - kube-prometheus-stack (startup history backfill, non-fatal if not ready yet)
  - name: vpa
    path: charts/right-sizing/vpa
    destination:
      namespace: vpa
    syncWave: 3
    # Chart bundles its own CRDs; avoids client-side apply's annotation size limit.
    syncOptions:
      - ServerSideApply=true

  # --- Goldilocks ---
  # Depends on:
  # - vpa (recommender + VPA CRD)
  # - See DaemonSets Priority above.
  - name: goldilocks
    path: charts/right-sizing/goldilocks
    destination:
      namespace: goldilocks
    syncWave: 4
  # Depends on:
  # - gateway-private
  # - goldilocks (the backend Service)
  - name: goldilocks-httproute
    path: charts/gateway-api/httproute
    destination:
      namespace: goldilocks
    syncWave: 6
    extraValueFiles:
      - charts/gateway-api/gateway/private-gateway-values.yaml
      - charts/gateway-api/httproute/goldilocks-httproute-values.yaml

  # --- Podinfo ---
  # Depends on:
  # - See DaemonSets Priority above.
  - name: podinfo
    path: manifests/podinfo
    destination:
      namespace: podinfo
    syncWave: 3
  # Depends on:
  # - gateway-public
  # - podinfo (the backend Service)
  - name: podinfo-httproute
    path: charts/gateway-api/httproute
    destination:
      namespace: podinfo
    syncWave: 6
    extraValueFiles:
      - charts/gateway-api/gateway/public-gateway-values.yaml
      - charts/gateway-api/httproute/podinfo-httproute-values.yaml
