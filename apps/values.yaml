config:
  spec:
    destination:
      server: https://kubernetes.default.svc
    source:
      repoURL: https://github.com/ConsciousML/argocd-app-of-apps-template
      targetRevision: main

appParams: {}

applications:
  # --- EBS CSI Driver ---
  - name: storage-class-gp3
    destination:
      namespace: kube-system
    # Zero dependencies, nothing waits on it: grouped with the CRDs, not the ESO controller.
    syncWave: -2

  # --- Gateway API ---
  - name: crds-gateway-api
    destination:
      namespace: argocd
    syncWave: -2
  - name: crds-aws-lbc-gateway-api
    destination:
      namespace: argocd
    syncWave: -2
  # `syncWave: -1` because it needs the Gateway API CRDs (`crds-gateway-api`) at wave -2.
  - name: gateway-class
    path: helm-gateway-api-gateway-class
    destination:
      namespace: gateway
    syncWave: -1
  # `syncWave: 1` because it needs the AWS LBC controller (from `helm-aws-lbc`) running to
  # reconcile the LoadBalancerConfiguration/TargetGroupConfiguration into an ALB.
  - name: gateway-public
    path: helm-gateway-api-gateway
    destination:
      namespace: gateway
    syncWave: 1
    extraValueFiles:
      - helm-gateway-api-gateway-class/values.yaml
      - helm-gateway-api-gateway/public-gateway-values.yaml
  - name: gateway-private
    path: helm-gateway-api-gateway
    destination:
      namespace: gateway
    syncWave: 1
    extraValueFiles:
      - helm-gateway-api-gateway-class/values.yaml
      - helm-gateway-api-gateway/private-gateway-values.yaml

  # --- AWS Load Balancer Controller ---
  - name: helm-aws-lbc
    destination:
      namespace: kube-system
    syncWave: 0
    # Chart bundles its own CRDs; avoids client-side apply's annotation size limit.
    syncOptions:
      - ServerSideApply=true
    tool:
      helm:
        # Must match the catalog's Pod Identity association's expected ServiceAccount name.
        releaseName: aws-load-balancer-controller

  # --- Karpenter ---
  - name: helm-karpenter
    destination:
      namespace: kube-system
    syncWave: 0
    # Chart bundles its own CRDs; avoids client-side apply's annotation size limit.
    syncOptions:
      - ServerSideApply=true
    tool:
      helm:
        # Must match the catalog's Pod Identity association's expected ServiceAccount name.
        releaseName: karpenter
  - name: helm-karpenter-config
    destination:
      namespace: kube-system
    # After the controller (and its CRDs) are up.
    syncWave: 1

  # --- ExternalDNS ---
  - name: helm-external-dns-private
    destination:
      namespace: external-dns
    syncWave: 0
    syncOptions:
      - ServerSideApply=true
    tool:
      helm:
        # Must match the catalog's Pod Identity association's expected ServiceAccount name.
        releaseName: external-dns-private
  - name: helm-external-dns-public
    destination:
      namespace: external-dns
    syncWave: 0
    syncOptions:
      - ServerSideApply=true
    tool:
      helm:
        # Must match the catalog's Pod Identity association's expected ServiceAccount name.
        releaseName: external-dns-public

  # --- External Secrets Operator ---
  - name: helm-external-secrets-operator
    destination:
      namespace: external-secrets
    syncWave: -1
    syncOptions:
      - ServerSideApply=true
    tool:
      helm:
        # Must match the catalog's Pod Identity association's expected ServiceAccount name.
        releaseName: external-secrets

  # --- ArgoCD ---
  - name: argocd-secrets
    path: helm-eso-secret-sync
    destination:
      namespace: argocd
    syncWave: 2
  - name: helm-argocd-ingress
    destination:
      namespace: argocd
    syncWave: 2

  # --- Tailscale ---
  - name: tailscale-secrets
    path: helm-eso-secret-sync
    destination:
      namespace: tailscale
    syncWave: 0
  - name: helm-tailscale-operator
    destination:
      namespace: tailscale
    syncWave: 1
    # Chart bundles its own CRDs; avoids client-side apply's annotation size limit.
    syncOptions:
      - ServerSideApply=true
  - name: helm-tailscale-connector
    destination:
      namespace: tailscale
    syncWave: 2

  # --- Prometheus stack ---
  - name: grafana-secrets
    path: helm-eso-secret-sync
    destination:
      namespace: monitoring
    syncWave: 0
  - name: helm-kube-prometheus-stack
    destination:
      namespace: monitoring
    syncWave: 1
    # Chart bundles the Prometheus Operator CRDs; avoids client-side apply's annotation size limit.
    syncOptions:
      - ServerSideApply=true
  - name: grafana-httproute
    path: helm-httproute
    destination:
      namespace: monitoring
    syncWave: 2
    extraValueFiles:
      - helm-gateway-api-gateway/private-gateway-values.yaml
  - name: prometheus-httproute
    path: helm-httproute
    destination:
      namespace: monitoring
    syncWave: 2
    extraValueFiles:
      - helm-gateway-api-gateway/private-gateway-values.yaml
  - name: alertmanager-httproute
    path: helm-httproute
    destination:
      namespace: monitoring
    syncWave: 2
    extraValueFiles:
      - helm-gateway-api-gateway/private-gateway-values.yaml

  # --- Guestbook ---
  - name: helm-guestbook
    destination:
      namespace: guestbook
    syncWave: 2
    extraValueFiles:
      - helm-gateway-api-gateway/public-gateway-values.yaml
