config:
  spec:
    destination:
      server: https://kubernetes.default.svc
    source:
      repoURL: https://github.com/ConsciousML/argocd-app-of-apps-template
      targetRevision: main

appParams: {}

applications:
  # --- EBS CSI Driver ---
  - name: storage-class-gp3
    destination:
      namespace: kube-system
    syncWave: -1

  # --- Priority Classes ---
  - name: priority-classes
    destination:
      namespace: kube-system
    syncWave: -1

  # --- DaemonSets Priority ---
  # helm-loki, helm-alloy, and helm-kube-prometheus-stack (wave 2) carry the cluster's
  # DaemonSets: Alloy itself, Loki's lokiCanary, and kube-prometheus-stack's node-exporter.
  # Karpenter only sizes a new node for a DaemonSet it already knows about, so a DaemonSet
  # that syncs after another app has already triggered a node launch can land Pending and
  # rely on daemonset-critical preemption to fit instead. Every app marked "See DaemonSets
  # Priority above" is held to wave 3 or later for this reason, on top of whatever real
  # dependencies it has.

  # --- Gateway API ---
  - name: crds-gateway-api
    destination:
      namespace: argocd
    syncWave: -1
  - name: crds-aws-lbc-gateway-api
    destination:
      namespace: argocd
    syncWave: -1
  # Depends on:
  # - crds-gateway-api (GatewayClass CRD)
  # - helm-aws-lbc (the controller sets GatewayClass's Accepted condition, which its health
  #   check waits on)
  # - See DaemonSets Priority above.
  - name: gateway-class
    path: helm-gateway-api-gateway-class
    destination:
      namespace: gateway
    syncWave: 4
  # Depends on:
  # - gateway-class
  # - crds-aws-lbc-gateway-api (LoadBalancerConfiguration/TargetGroupConfiguration CRDs)
  # - helm-aws-lbc (controller reconciles into an ALB)
  # - See DaemonSets Priority above.
  - name: gateway-public
    path: helm-gateway-api-gateway
    destination:
      namespace: gateway
    syncWave: 5
    extraValueFiles:
      - helm-gateway-api-gateway-class/values.yaml
      - helm-gateway-api-gateway/public-gateway-values.yaml
  # Same dependencies as gateway-public.
  - name: gateway-private
    path: helm-gateway-api-gateway
    destination:
      namespace: gateway
    syncWave: 5
    extraValueFiles:
      - helm-gateway-api-gateway-class/values.yaml
      - helm-gateway-api-gateway/private-gateway-values.yaml

  # --- AWS Load Balancer Controller ---
  # Depends on:
  # - See DaemonSets Priority above.
  - name: helm-aws-lbc
    destination:
      namespace: kube-system
    syncWave: 3
    # Chart bundles its own CRDs; avoids client-side apply's annotation size limit.
    syncOptions:
      - ServerSideApply=true
    tool:
      helm:
        # Must match the catalog's Pod Identity association's expected ServiceAccount name.
        releaseName: aws-load-balancer-controller

  # Karpenter (controller, EC2NodeClass, and both NodePools) is entirely Terraform-managed,
  # applied before app-of-apps ever syncs. See units/eks/addons/karpenter in the catalog repo.

  # --- ExternalDNS ---
  # Depends on:
  # - crds-gateway-api (watches gateway-httproute sources)
  # - See DaemonSets Priority above.
  - name: helm-external-dns-private
    path: helm-external-dns
    destination:
      namespace: external-dns
    syncWave: 3
    syncOptions:
      - ServerSideApply=true
    tool:
      helm:
        # Must match the catalog's Pod Identity association's expected ServiceAccount name.
        releaseName: external-dns-private
    extraValueFiles:
      - helm-external-dns/external-dns-private-values.yaml
    # ArgoCD auto-adds these for the PreDelete hook in predelete-hook.yaml; declared here so sync doesn't flap.
    finalizers:
      - pre-delete-finalizer.argocd.argoproj.io
      - pre-delete-finalizer.argocd.argoproj.io/cleanup
  # Same dependencies as helm-external-dns-private.
  - name: helm-external-dns-public
    path: helm-external-dns
    destination:
      namespace: external-dns
    syncWave: 3
    syncOptions:
      - ServerSideApply=true
    tool:
      helm:
        # Must match the catalog's Pod Identity association's expected ServiceAccount name.
        releaseName: external-dns-public
    extraValueFiles:
      - helm-external-dns/external-dns-public-values.yaml
    finalizers:
      - pre-delete-finalizer.argocd.argoproj.io
      - pre-delete-finalizer.argocd.argoproj.io/cleanup

  # --- External Secrets Operator ---
  - name: helm-external-secrets-operator
    destination:
      namespace: external-secrets
    syncWave: 0
    syncOptions:
      - ServerSideApply=true
    tool:
      helm:
        # Must match the catalog's Pod Identity association's expected ServiceAccount name.
        releaseName: external-secrets

  # --- Loki ---
  - name: helm-loki
    destination:
      namespace: loki
    syncWave: 0
    tool:
      helm:
        # Must match the catalog's Pod Identity association's expected ServiceAccount name.
        releaseName: loki

  # --- Alloy ---
  # No hard dependency on helm-loki: it pushes logs to loki-gateway.loki but retries on
  # write failure, so it doesn't need Loki up first. Synced in the same wave as Loki so both
  # DaemonSets (Alloy itself, Loki's lokiCanary) exist as early as possible. See DaemonSets
  # Priority above.
  - name: helm-alloy
    destination:
      namespace: loki
    syncWave: 0
    tool:
      helm:
        releaseName: alloy

  # --- Prometheus Rules ---
  - name: prometheus-rules
    destination:
      namespace: monitoring
    syncWave: 0
  # Depends on helm-external-secrets-operator.
  - name: argocd-secrets
    path: helm-eso-secret-sync
    destination:
      namespace: argocd
    syncWave: 1
    extraValueFiles:
      - helm-eso-secret-sync/argocd-secrets-values.yaml
  # Depends on:
  # - helm-aws-lbc
  # - gateway-private (ingress routes through the private gateway)
  - name: helm-argocd-ingress
    destination:
      namespace: argocd
    syncWave: 6

  # --- Tailscale ---
  # Depends on helm-external-secrets-operator.
  - name: tailscale-secrets
    path: helm-eso-secret-sync
    destination:
      namespace: tailscale
    syncWave: 1
    extraValueFiles:
      - helm-eso-secret-sync/tailscale-secrets-values.yaml
  # Depends on:
  # - tailscale-secrets (needs the oauth secret before it can register with Tailscale)
  # - See DaemonSets Priority above.
  - name: helm-tailscale-operator
    destination:
      namespace: tailscale
    syncWave: 3
    # Chart bundles its own CRDs; avoids client-side apply's annotation size limit.
    syncOptions:
      - ServerSideApply=true
  # Depends on helm-tailscale-operator (controller and its CRDs).
  - name: helm-tailscale-connector
    destination:
      namespace: tailscale
    syncWave: 4

  # --- Prometheus stack ---
  # Depends on helm-external-secrets-operator.
  - name: grafana-secrets
    path: helm-eso-secret-sync
    destination:
      namespace: monitoring
    syncWave: 1
    extraValueFiles:
      - helm-eso-secret-sync/grafana-secrets-values.yaml
  # Depends on helm-external-secrets-operator.
  - name: alertmanager-secrets
    path: helm-eso-secret-sync
    destination:
      namespace: monitoring
    syncWave: 1
    extraValueFiles:
      - helm-eso-secret-sync/alertmanager-secrets-values.yaml
  # Depends on:
  # - grafana-secrets (needs the admin secret before Grafana's first boot)
  # - alertmanager-secrets (Alertmanager mounts it via alertmanagerSpec.secrets, so it must
  #   exist before the pod can start)
  - name: helm-kube-prometheus-stack
    destination:
      namespace: monitoring
    syncWave: 2
    # Avoids client-side apply's annotation size limit on this release's larger resources
    # (e.g. the bundled default PrometheusRules).
    syncOptions:
      - ServerSideApply=true
    tool:
      helm:
        # fullnameOverride only pins this chart's own resources (prometheus/alertmanager/
        # operator); bundled subcharts (grafana, kube-state-metrics, node-exporter) derive
        # their own names from the release name instead, which backendRefs rely on. Must
        # match the catalog's local.kube_prometheus_stack_release (units/eks/addons/argocd/
        # app_of_apps/terragrunt.hcl in terragrunt-template-catalog-eks).
        releaseName: kube-prometheus-stack
    extraValueFiles:
      - helm-eso-secret-sync/grafana-secrets-values.yaml
  # Depends on:
  # - gateway-private
  # - helm-kube-prometheus-stack (the backend Service)
  - name: grafana-httproute
    path: helm-httproute
    destination:
      namespace: monitoring
    syncWave: 6
    extraValueFiles:
      - helm-gateway-api-gateway/private-gateway-values.yaml
      - helm-httproute/grafana-httproute-values.yaml
  # Same dependencies as grafana-httproute.
  - name: prometheus-httproute
    path: helm-httproute
    destination:
      namespace: monitoring
    syncWave: 6
    extraValueFiles:
      - helm-gateway-api-gateway/private-gateway-values.yaml
      - helm-httproute/prometheus-httproute-values.yaml
  # Same dependencies as grafana-httproute.
  - name: alertmanager-httproute
    path: helm-httproute
    destination:
      namespace: monitoring
    syncWave: 6
    extraValueFiles:
      - helm-gateway-api-gateway/private-gateway-values.yaml
      - helm-httproute/alertmanager-httproute-values.yaml

  # --- VPA (recommender only) ---
  # Depends on:
  # - See DaemonSets Priority above.
  # - helm-kube-prometheus-stack (startup history backfill, non-fatal if not ready yet)
  - name: helm-vpa
    destination:
      namespace: vpa
    syncWave: 3
    # Chart bundles its own CRDs; avoids client-side apply's annotation size limit.
    syncOptions:
      - ServerSideApply=true

  # --- Goldilocks ---
  # Depends on:
  # - helm-vpa (recommender + VPA CRD)
  # - See DaemonSets Priority above.
  - name: helm-goldilocks
    destination:
      namespace: goldilocks
    syncWave: 4
  # Depends on:
  # - gateway-private
  # - helm-goldilocks (the backend Service)
  - name: goldilocks-httproute
    path: helm-httproute
    destination:
      namespace: goldilocks
    syncWave: 6
    extraValueFiles:
      - helm-gateway-api-gateway/private-gateway-values.yaml
      - helm-httproute/goldilocks-httproute-values.yaml

  # --- Guestbook ---
  # Depends on:
  # - See DaemonSets Priority above.
  - name: guestbook
    destination:
      namespace: guestbook
    syncWave: 3
  # Depends on:
  # - gateway-public
  # - guestbook (the backend Service)
  - name: guestbook-httproute
    path: helm-httproute
    destination:
      namespace: guestbook
    syncWave: 6
    extraValueFiles:
      - helm-gateway-api-gateway/public-gateway-values.yaml
      - helm-httproute/guestbook-httproute-values.yaml
