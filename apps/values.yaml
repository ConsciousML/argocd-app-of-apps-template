config:
  spec:
    destination:
      server: https://kubernetes.default.svc
    source:
      repoURL: https://github.com/ConsciousML/argocd-app-of-apps-template
      targetRevision: main

appParams: {}

applications:
  - name: guestbook-helm
    destination:
      namespace: guestbook
  - name: gateway-api-crds
    destination:
      namespace: argocd
    syncWave: -1
  - name: aws-lbc-gateway-api-crds
    destination:
      namespace: argocd
    syncWave: -1
