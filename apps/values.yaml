config:
  spec:
    destination:
      server: https://kubernetes.default.svc
    source:
      repoURL: https://github.com/ConsciousML/argocd-app-of-apps-template
      targetRevision: main

appParams: {}

applications:
  - name: crds-gateway-api
    destination:
      namespace: argocd
    syncWave: -1
  - name: crds-aws-lbc-gateway-api
    destination:
      namespace: argocd
    syncWave: -1
  - name: helm-aws-lbc
    destination:
      namespace: kube-system
    syncWave: 0
    tool:
      helm:
        # Must match the catalog's Pod Identity association's expected ServiceAccount name.
        releaseName: aws-load-balancer-controller
  - name: helm-guestbook
    destination:
      namespace: guestbook
    syncWave: 0
