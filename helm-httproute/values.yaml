gateway:
  name: ""
  namespace: ""
name: ""
# Injected per instance by the catalog (terragrunt-template-catalog-eks) via appParams,
# from domains.hcl. See units/eks/addons/argocd/app_of_apps in that repo. No instance
# sets this itself.
host: ""
# matches is Gateway API HTTPRouteMatch syntax. backendRefKey is a key into backendRefs,
# not the backend itself, so appParams can override just a name (e.g. compose
# "<release>-grafana") without restating the whole rules list.
rules: []
backendRefs: {}
annotations: {}
