name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  code-quality-checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install mise
        uses: jdx/mise-action@v4.0.1
        with:
          version: 2026.4.0

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Run pre-commit hooks (prek)
        uses: j178/prek-action@v2.0.4
