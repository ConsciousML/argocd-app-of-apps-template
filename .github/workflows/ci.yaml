name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  code-quality-checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Fail on leftover TEMP markers
        run: |
          if grep -rn "TEMP:" --exclude-dir=.git .; then
            echo "Found leftover TEMP: marker(s), revert before merging." >&2
            exit 1
          fi

      - name: Install mise
        uses: jdx/mise-action@v4.0.1
        with:
          version: 2026.4.0

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Add Helm chart repos
        run: scripts/helm-repo-add.sh

      - name: Run pre-commit hooks (prek)
        uses: j178/prek-action@v2.0.4
        with:
          extra-args: --all-files --skip trivy

      # Trivy scans Helm charts' built dependencies (charts/), which the
      # validate-helm hook above populates via `helm dependency build`.
      # Running it as its own invocation guarantees it starts after that
      # step, since prek parallelizes hooks within a single run.
      - name: Trivy
        uses: j178/prek-action@v2.0.4
        with:
          extra-args: --all-files trivy

      # Not run via prek: doesn't fail on vulnerabilities, it's for auditing only.
      - name: Trivy image vulnerability scan
        run: scripts/trivy-image-scan.sh
