apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook-ui
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: guestbook-ui
  template:
    metadata:
      labels:
        app: guestbook-ui
    spec:
      # Allows scheduling onto Karpenter-provisioned nodes, which are tainted by default.
      tolerations:
        - key: "karpenter.sh/provisioned"
          operator: "Exists"
          effect: "NoSchedule"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - image: gcr.io/google-samples/gb-frontend:v5
          name: guestbook-ui
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "15m"
              memory: "100Mi"
            limits:
              cpu: "75m"
              memory: "100Mi"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: apache-run
              mountPath: /var/run/apache2
            - name: apache-lock
              mountPath: /var/lock/apache2
            - name: apache-log
              mountPath: /var/log/apache2
      volumes:
        - name: apache-run
          emptyDir:
            sizeLimit: 16Mi
        - name: apache-lock
          emptyDir:
            sizeLimit: 16Mi
        - name: apache-log
          emptyDir:
            sizeLimit: 64Mi
