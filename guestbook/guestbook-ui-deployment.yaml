apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook-ui
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: guestbook-ui
  template:
    metadata:
      labels:
        app: guestbook-ui
    spec:
      # Allows scheduling onto Karpenter-provisioned nodes, which are tainted by default.
      tolerations:
        - key: "karpenter.sh/provisioned"
          operator: "Exists"
          effect: "NoSchedule"
      # Prefers the static managed node group over Karpenter, falling back to Karpenter only
      # when no managed-group capacity is available.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: karpenter.sh/nodepool
                    operator: DoesNotExist
      containers:
        - image: gcr.io/google-samples/gb-frontend:v5
          name: guestbook-ui
          ports:
            - containerPort: 80
