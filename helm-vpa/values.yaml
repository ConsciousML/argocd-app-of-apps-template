vpa:
  recommender:
    enabled: true
    # Memory targets p99 instead of the chart's default p90: OOM kills are a hard
    # failure, so memory gets a higher percentile on top of the default 15% margin.
    # CPU stays at the chart default (p90) since throttling is a soft failure and
    # doesn't warrant stacking a higher percentile on top of the margin too.
    extraArgs:
      target-cpu-percentile: "0.90"
      target-memory-percentile: "0.99"
      # Backfills history from Prometheus so recommendations exist immediately, not after 24h.
      storage: prometheus
      prometheus-address: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
      # kube-prometheus-stack's cadvisor metrics use job=kubelet and label pod, not
      # the recommender's defaults (kubernetes-cadvisor and pod_name).
      prometheus-cadvisor-job-name: kubelet
      container-pod-name-label: pod
      # Works around a recommender bug (kubernetes/autoscaler#5031): the default
      # pod-labels query has no range selector, so it can never satisfy the matrix
      # result the recommender requires. kube_pod_labels isn't scraped here, so use
      # kube_pod_info instead, which carries the same namespace and pod labels.
      metric-for-pod-labels: kube_pod_info{job="kube-state-metrics"}[8d]
      pod-namespace-label: namespace
      pod-name-label: pod
    resources:
      requests:
        cpu: 15m
        memory: 100Mi
      limits:
        memory: 100Mi
    nodeSelector:
      karpenter.sh/nodepool: elastic
    tolerations:
      - key: karpenter.sh/workload-class
        operator: Equal
        value: elastic
        effect: NoSchedule
  updater:
    enabled: false
  admissionController:
    enabled: false
  # Provisioned as the EKS-managed metrics-server addon (terragrunt-template-catalog-eks),
  # not by this chart.
  metrics-server:
    enabled: false
