vpa:
  recommender:
    enabled: true
    # Target CPU at p95 and memory at p99 instead of the chart's default p90/p90,
    # so recommendations track burst/peak usage more closely.
    extraArgs:
      target-cpu-percentile: "0.95"
      target-memory-percentile: "0.99"
  updater:
    enabled: false
  admissionController:
    enabled: false
  # Provisioned as the EKS-managed metrics-server addon (terragrunt-template-catalog-eks),
  # not by this chart.
  metrics-server:
    enabled: false
