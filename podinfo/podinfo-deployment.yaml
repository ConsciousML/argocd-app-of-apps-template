apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: podinfo
  template:
    metadata:
      labels:
        app: podinfo
    spec:
      # Pins onto the elastic NodePool: the toleration alone only allows scheduling there,
      # nodeSelector is what keeps it from landing on the untainted MNG instead.
      nodeSelector:
        karpenter.sh/nodepool: elastic
      tolerations:
        - key: "karpenter.sh/workload-class"
          operator: "Equal"
          value: "elastic"
          effect: "NoSchedule"
      containers:
        - image: ghcr.io/stefanprodan/podinfo:6.14.1
          name: podinfo
          ports:
            - name: http
              containerPort: 9898
            - name: http-metrics
              containerPort: 9797
            - name: grpc
              containerPort: 9999
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
