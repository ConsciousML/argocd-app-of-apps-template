apiVersion: gateway.k8s.aws/v1beta1
kind: LoadBalancerConfiguration
metadata:
  name: {{ .Values.loadBalancerConfigName | quote }}
  namespace: {{ .Values.gateway.namespace | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  scheme: {{ .Values.scheme | quote }}
  defaultTargetGroupConfiguration:
    name: {{ .Values.targetGroupConfigName | quote }}
  listenerConfigurations:
    - protocolPort: HTTPS:443
      defaultCertificate: {{ .Values.certificateArn | quote }}
