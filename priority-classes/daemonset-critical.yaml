apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: daemonset-critical
# One below system-cluster-critical (2000000000): high enough to preempt ordinary workloads
# so a DaemonSet pod isn't left Pending on an already-full node, but not equal to or above
# system-cluster-critical or system-node-critical, so it can never preempt cluster-critical
# controllers (Karpenter, the ArgoCD application-controller) to make room for itself.
value: 1999999000
globalDefault: false
description: For cluster-wide DaemonSets that must land on every node but shouldn't be able to preempt cluster-critical controllers to do it.
