# Gives this instance time to notice a just-deleted Ingress/HTTPRoute and clean up its
# Route53 records before its own Deployment is torn down (catalog repo issue #25).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-predelete
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PreDelete
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sleep
          image: busybox
          command: ["sleep", "60"]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
