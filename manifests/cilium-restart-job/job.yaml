apiVersion: batch/v1
kind: Job
metadata:
  name: cilium-cep-restart
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  # 1 retry: the whole run is idempotent (re-restarting an already-restarted workload is a
  # no-op risk-wise), so one retry absorbs a transient failure without masking a real one.
  backoffLimit: 1
  # Each target gets up to 10m for its own rollout status wait; this is a safety net for
  # the whole run across every target found, not a per-target timeout.
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cilium-cep-restart
    spec:
      serviceAccountName: cilium-cep-restart
      restartPolicy: Never
      nodeSelector:
        karpenter.sh/nodepool: critical
      tolerations:
        - key: karpenter.sh/workload-class
          operator: Equal
          value: critical
          effect: NoSchedule
      containers:
        - name: restart-missing-ceps
          image: alpine/k8s:1.30.0
          command: ["sh", "/scripts/restart-missing-ceps.sh"]
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: cilium-cep-restart-script
            defaultMode: 0555
