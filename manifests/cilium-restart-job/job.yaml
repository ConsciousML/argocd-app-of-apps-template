apiVersion: batch/v1
kind: Job
metadata:
  name: cilium-cep-restart
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  # The whole run is idempotent (re-restarting an already-restarted workload is a no-op
  # risk-wise), so retries absorb transient failures without masking a real one. Raised from
  # 1: a wave-0 Application can report Healthy before its DaemonSet pods are actually Ready
  # (aggregated health lags real pod state), racing this job's restart against cilium startup.
  backoffLimit: 4
  # Each target gets up to 10m for its own rollout status wait; this is a safety net for
  # the whole run across every target found, not a per-target timeout.
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cilium-cep-restart
    spec:
      serviceAccountName: cilium-cep-restart
      restartPolicy: Never
      nodeSelector:
        karpenter.sh/nodepool: critical
      tolerations:
        - key: karpenter.sh/workload-class
          operator: Equal
          value: critical
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: restart-missing-ceps
          image: alpine/k8s:1.30.0
          command: ["sh", "/scripts/restart-missing-ceps.sh"]
          # kubectl caches discovery/HTTP data under $HOME/.kube by default, which needs
          # somewhere writable now that the root filesystem is read-only.
          env:
            - name: HOME
              value: /tmp
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /scripts
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: cilium-cep-restart-script
            defaultMode: 0555
        - name: tmp
          emptyDir: {}
