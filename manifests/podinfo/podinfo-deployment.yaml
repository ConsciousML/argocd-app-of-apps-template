apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
spec:
  # No replicas set: the HPA owns this field. Setting it here would fight ArgoCD's
  # selfHeal, which reverts spec.replicas back to whatever git declares on every sync.
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: podinfo
  template:
    metadata:
      labels:
        app: podinfo
    spec:
      # Pins onto the elastic NodePool: the toleration alone only allows scheduling there,
      # nodeSelector is what keeps it from landing on the untainted MNG instead.
      nodeSelector:
        karpenter.sh/nodepool: elastic
      tolerations:
        - key: "karpenter.sh/workload-class"
          operator: "Equal"
          value: "elastic"
          effect: "NoSchedule"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - image: ghcr.io/stefanprodan/podinfo:6.14.1
          name: podinfo
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 9898
            - name: grpc
              containerPort: 9999
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 35M
            limits:
              cpu: 50m
              memory: 35M
