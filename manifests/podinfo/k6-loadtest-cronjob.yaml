apiVersion: batch/v1
kind: CronJob
metadata:
  name: k6-loadtest
spec:
  # Suspended, schedule never fires. A plain Job would work once, but ArgoCD won't
  # recreate it after it completes. This stays re-triggerable with one command:
  # kubectl create job --from=cronjob/k6-loadtest <name> -n podinfo
  schedule: "0 0 1 1 *"
  suspend: true
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: k6-loadtest
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: k6
              image: grafana/k6
              command: ["k6", "run", "/script/script.js"]
              # k6 needs a writable HOME (cache/state), root filesystem is read-only.
              env:
                - name: HOME
                  value: /tmp
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: script
                  mountPath: /script
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: k6-loadtest-script
            - name: tmp
              emptyDir: {}
