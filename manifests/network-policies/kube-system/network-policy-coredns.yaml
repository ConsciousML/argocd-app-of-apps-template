apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: coredns
  namespace: kube-system
spec:
  endpointSelector:
    matchLabels:
      k8s-app: kube-dns
  ingress:
    # Every namespace resolves DNS through coredns. `cluster` avoids re-listing every
    # consumer here as they're added (same reasoning as the prometheus egress fix).
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Kubelet liveness (8080) and readiness (8181) probes.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "8181"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9153"
              protocol: TCP
  egress:
    # Upstream DNS forwarding (VPC resolver), the only egress coredns itself needs
    # beyond kube-apiserver (covered by network-policy-shared-egress.yaml).
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
