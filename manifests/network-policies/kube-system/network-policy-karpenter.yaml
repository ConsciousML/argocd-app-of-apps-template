apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: karpenter
  namespace: kube-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: karpenter
  ingress:
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    # EC2 Fleet API and the SQS interruption queue, both reached via NAT as `world`.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
