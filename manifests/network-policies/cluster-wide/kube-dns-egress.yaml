apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: kube-dns-egress
spec:
  endpointSelector:
    matchExpressions:
      - key: io.kubernetes.pod.namespace
        operator: In
        # add a namespace name here to opt it in
        # argocd and kube-system excluded: each has its own copy (network-policies/argocd/,
        # network-policies/kube-system/), to avoid depending on this Application syncing for
        # their own network access (lockout risk)
        values:
          - vpa
          - external-secrets
          - external-dns
          - tailscale
          - loki
          - monitoring
          - podinfo
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
