apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: kube-apiserver-egress
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace.labels.network-policy.kube-apiserver-egress: "true"
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
