apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: argocd-redis-secret-init
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-redis-secret-init
  # Pre-install/pre-upgrade Job, creates the redis auth Secret via the Kubernetes API. No
  # ingress, and no direct connection to redis itself. Its only need, kube-apiserver egress, is
  # covered by manifests/network-policies/cluster-wide/kube-apiserver-egress.yaml.
