apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: argocd-applicationset-controller
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-applicationset-controller
  # No ingress: metrics and probes are disabled by chart default, not overridden in helm_values.
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: argocd-repo-server
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    # SCM/PR generators calling out to the Git provider's API (e.g. GitHub).
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
