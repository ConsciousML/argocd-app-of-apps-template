apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: argocd-notifications-controller
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-notifications-controller
  ingress:
    # kube-prometheus-stack scraping /metrics (ServiceMonitor). No probe ingress: readinessProbe/
    # livenessProbe are disabled by chart default.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9001"
              protocol: TCP
  egress:
    # Notification services (Slack, webhooks, etc). None are configured yet in helm_values, but
    # this is the addressable pattern once one is.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
