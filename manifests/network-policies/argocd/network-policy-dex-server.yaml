apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: argocd-dex-server
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-dex-server
  ingress:
    # Server proxies /api/dex (login flow) over http and calls the grpc API directly.
    # No kubelet probe ingress: dex.livenessProbe/readinessProbe are disabled by chart default.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: argocd-server
      toPorts:
        - ports:
            - port: "5556"
              protocol: TCP
            - port: "5557"
              protocol: TCP
  # kube-apiserver egress (dex's cmd-util-dex init container reads the initial argocd-cm/
  # argocd-secret over the API, confirmed live via hubble observe) is covered by
  # manifests/network-policies/cluster-wide/kube-apiserver-egress.yaml.
  #
  # No dex.config connectors are set in helm_values (pipelines/dev/eks/stack/terragrunt.stack.hcl),
  # so there's no external IdP to reach yet. Add an egress rule here if OIDC connectors get
  # configured.
