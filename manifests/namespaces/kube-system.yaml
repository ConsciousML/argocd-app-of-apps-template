apiVersion: v1
kind: Namespace
metadata:
  name: kube-system
  labels:
    # aws-node, kube-proxy, ebs-csi-node, and eks-pod-identity-agent need hostNetwork/
    # hostPath/privileged access to manage the node, baseline would reject them.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
