apiVersion: v1
kind: Namespace
metadata:
  name: vpa
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
    # opt-in to manifests/network-policies/cluster-wide, one label per policy
    network-policy.default-deny: "true"
    network-policy.kube-apiserver-egress: "true"
    network-policy.kube-dns-egress: "true"
