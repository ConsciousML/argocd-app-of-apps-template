external-dns:
  provider:
    name: aws
  txtOwnerId: "cluster"
  domainFilters: []
  triggerLoopOnEvent: true
  sources:
    - service
    - ingress
    - gateway-httproute
  registry: txt
  policy: sync
  logLevel: info
  annotationFilter: external-dns.alpha.kubernetes.io/scope=public
  extraArgs:
    aws-zone-type: public
  serviceAccount:
    name: external-dns-public
