apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: external-secrets-controller
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets
  ingress:
    # kube-prometheus-stack scraping /metrics (PodMonitor).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    # secretsmanager.<region>.amazonaws.com, no VPC endpoint configured so
    # this egresses through the NAT gateway to public AWS IPs ("world").
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
