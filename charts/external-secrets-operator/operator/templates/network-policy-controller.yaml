apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: external-secrets-controller
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets
  ingress:
    # kube-prometheus-stack scraping /metrics (PodMonitor).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    # secretsmanager.<region>.amazonaws.com, via the VPC interface endpoint.
    - toCIDR:
        {{- range .Values.vpcEndpointCidrs.secretsmanager }}
        - {{ . }}/32
        {{- end }}
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
