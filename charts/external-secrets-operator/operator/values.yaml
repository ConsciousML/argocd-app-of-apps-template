external-secrets:
  serviceMonitor:
    enabled: true

  resources:
    requests:
      cpu: 11m
      memory: 50M
    limits:
      cpu: 11m
      memory: 50M

  # The chart only renders spec.securityContext (pod-level) when podSecurityContext has
  # more than just 'enabled', otherwise it's omitted even though container-level hardening
  # (readOnlyRootFilesystem, runAsNonRoot, runAsUser 1000, ...) is already applied by default.
  # runAsNonRoot here just makes that existing container-level guarantee explicit at the pod level.
  podSecurityContext:
    runAsNonRoot: true

  nodeSelector:
    karpenter.sh/nodepool: elastic
  tolerations:
    - key: karpenter.sh/workload-class
      operator: Equal
      value: elastic
      effect: NoSchedule

  webhook:
    podSecurityContext:
      runAsNonRoot: true
    resources:
      requests:
        cpu: 11m
        memory: 50M
      limits:
        cpu: 55m
        memory: 50M
    nodeSelector:
      karpenter.sh/nodepool: elastic
    tolerations:
      - key: karpenter.sh/workload-class
        operator: Equal
        value: elastic
        effect: NoSchedule

  certController:
    podSecurityContext:
      runAsNonRoot: true
    resources:
      requests:
        cpu: 11m
        memory: 79M
      limits:
        cpu: 11m
        memory: 79M
    nodeSelector:
      karpenter.sh/nodepool: elastic
    tolerations:
      - key: karpenter.sh/workload-class
        operator: Equal
        value: elastic
        effect: NoSchedule
