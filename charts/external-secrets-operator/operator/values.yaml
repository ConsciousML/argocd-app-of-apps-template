vpcEndpointCidrs:
  # -- Secrets Manager VPC interface endpoint IPs the controller's network policy allows egress to. Injected by the catalog via `appParams`.
  # @section -- Network Policy
  secretsmanager: []

external-secrets:
  # -- Enables the Prometheus `ServiceMonitor`.
  # @section -- Controller
  serviceMonitor:
    enabled: true

  # -- Controller resource requests and limits.
  # @section -- Controller
  # @default -- see values.yaml
  resources:
    requests:
      cpu: 11m
      memory: 50M
    limits:
      cpu: 11m
      memory: 50M

  # The chart only renders spec.securityContext (pod-level) when podSecurityContext has
  # more than just 'enabled', otherwise it's omitted even though container-level hardening
  # (readOnlyRootFilesystem, runAsNonRoot, runAsUser 1000, ...) is already applied by default.
  # runAsNonRoot here just makes that existing container-level guarantee explicit at the pod level.
  # -- Sets `runAsNonRoot` at the pod level, also on `webhook` and `certController`.
  # @section -- Controller
  # @default -- see values.yaml
  podSecurityContext:
    runAsNonRoot: true

  # -- Pins the controller to the `elastic` NodePool, with a matching `tolerations` entry. `webhook` and `certController` set the same.
  # @section -- Controller
  # @default -- see values.yaml
  nodeSelector:
    karpenter.sh/nodepool: elastic
  tolerations:
    - key: karpenter.sh/workload-class
      operator: Equal
      value: elastic
      effect: NoSchedule

  webhook:
    podSecurityContext:
      runAsNonRoot: true
    # -- Webhook resource requests and limits.
    # @section -- Webhook
    # @default -- see values.yaml
    resources:
      requests:
        cpu: 11m
        memory: 50M
      limits:
        cpu: 55m
        memory: 50M
    nodeSelector:
      karpenter.sh/nodepool: elastic
    tolerations:
      - key: karpenter.sh/workload-class
        operator: Equal
        value: elastic
        effect: NoSchedule

  certController:
    podSecurityContext:
      runAsNonRoot: true
    # -- Cert controller resource requests and limits.
    # @section -- Cert Controller
    # @default -- see values.yaml
    resources:
      requests:
        cpu: 11m
        memory: 79M
      limits:
        cpu: 11m
        memory: 79M
    nodeSelector:
      karpenter.sh/nodepool: elastic
    tolerations:
      - key: karpenter.sh/workload-class
        operator: Equal
        value: elastic
        effect: NoSchedule
