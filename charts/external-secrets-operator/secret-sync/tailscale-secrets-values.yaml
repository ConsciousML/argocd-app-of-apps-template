name: tailscale-operator-oauth
targetSecretName: operator-oauth
# ESO is the sole owner of this secret (unlike argocd-secret), and the source OAuth client
# can be rotated, so create it and keep polling.
targetCreationPolicy: Owner
refreshPolicy: Periodic
data:
  - secretKey: client_id
    remoteProperty: client_id
  - secretKey: client_secret
    remoteProperty: client_secret
