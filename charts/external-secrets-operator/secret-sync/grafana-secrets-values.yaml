name: grafana-admin-password
targetSecretName: &secretName grafana-admin-credentials
targetCreationPolicy: Owner
data:
  - secretKey: &secretKey admin-password
    remoteProperty: plaintext

# Consumed by the helm-kube-prometheus-stack Application via the same extraValueFiles entry,
# so both charts agree on the same target Secret name/key without duplicating the strings.
kube-prometheus-stack:
  grafana:
    admin:
      existingSecret: *secretName
      passwordKey: *secretKey
