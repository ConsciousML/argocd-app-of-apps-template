apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.secretStoreName | quote }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # Sync-wave ordering is reversed on delete (last wave pruned first), so this ensures
    # the ExternalSecret (wave 0) is deleted before this SecretStore it depends on.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.awsRegion | quote }}
