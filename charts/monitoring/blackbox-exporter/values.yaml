prometheus-blackbox-exporter:
  # From the VPA target recommendation (goldilocks-helm-blackbox-exporter-prometheus-blackbox-exporter),
  # revisit once more usage history accumulates.
  # -- Resource requests and limits.
  # @section -- Exporter
  # @default -- see values.yaml
  resources:
    requests: { cpu: 15m, memory: 100Mi }
    limits: { memory: 100Mi }

  # Chart only sets this at the container level by default; matches it here to satisfy
  # KSV-0118 (pod-level securityContext).
  # -- Pod-level non-root user, UID and GID 1000.
  # @section -- Exporter
  # @default -- see values.yaml
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000

  # -- Pins the exporter to the `critical` NodePool, with a matching `tolerations` entry.
  # @section -- Exporter
  # @default -- see values.yaml
  nodeSelector:
    karpenter.sh/nodepool: critical
  tolerations:
    - key: karpenter.sh/workload-class
      operator: Equal
      value: critical
      effect: NoSchedule

  # One ServiceMonitor per target, scraping /probe against that target's URL. Real targets
  # injected by the catalog (eks-forge-catalog) via appParams, from domains.hcl.
  serviceMonitor:
    enabled: true
    defaults:
      # -- Probe module for every target, expecting an HTTP 2xx.
      # @section -- Probes
      module: http_2xx
    # -- Endpoints to probe, one `ServiceMonitor` each. Injected by the catalog via `appParams`, from `domains.hcl`.
    # @section -- Probes
    targets: []

  # component: uptime on each rule (not additionalLabels, that only sets the PrometheusRule
  # object's own k8s labels, not each alert's) drives Alertmanager's routing tree (see
  # helm-kube-prometheus-stack).
  prometheusRule:
    enabled: true
    # -- Uptime alerts: endpoint down, slow probe, and SSL certificate expiry. Each carries `component: uptime`, which Alertmanager routes on.
    # @section -- Alerts
    # @default -- see values.yaml
    rules:
      - alert: EndpointDown
        expr: probe_success == 0
        for: 5m
        labels: { severity: critical, component: uptime }
        annotations:
          summary: "{{ $labels.target }} is unreachable"
          description: "Probe to {{ $labels.target }} has failed for 5m."
      - alert: BlackboxSlowProbe
        expr: avg_over_time(probe_duration_seconds[1m]) > 1
        for: 1m
        labels: { severity: warning, component: uptime }
        annotations:
          summary: "{{ $labels.target }} probe is slow"
          description: "Probe to {{ $labels.target }} has averaged over 1s for 1m."
      - alert: BlackboxSslCertificateWillExpireSoon
        expr: probe_ssl_earliest_cert_expiry - time() < 86400 * 30
        for: 0m
        labels: { severity: warning, component: uptime }
        annotations:
          summary: "{{ $labels.target }} SSL certificate expiring soon"
          description: "SSL certificate for {{ $labels.target }} expires in under 30 days."
      - alert: BlackboxSslCertificateWillExpireCritical
        expr: probe_ssl_earliest_cert_expiry - time() < 86400 * 3
        for: 0m
        labels: { severity: critical, component: uptime }
        annotations:
          summary: "{{ $labels.target }} SSL certificate expiring imminently"
          description: "SSL certificate for {{ $labels.target }} expires in under 3 days."
      - alert: BlackboxSslCertificateExpired
        expr: probe_ssl_earliest_cert_expiry - time() <= 0
        for: 0m
        labels: { severity: critical, component: uptime }
        annotations:
          summary: "{{ $labels.target }} SSL certificate expired"
          description: "SSL certificate for {{ $labels.target }} has expired."
