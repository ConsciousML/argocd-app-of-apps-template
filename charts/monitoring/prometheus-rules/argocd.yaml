apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: argocd-mixin
spec:
  groups:
    - name: argo-cd
      rules:
        - alert: ArgoCdAppSyncFailed
          annotations:
            description: "The application {{ $labels.dest_server }}/{{ $labels.project }}/{{ $labels.name }} has failed to sync with the status {{ $labels.phase }} the past 10m."
            summary: "An ArgoCD Application has Failed to Sync."
          expr: |
            sum(
              round(
                increase(
                  argocd_app_sync_total{
                    job=~"(argocd|argo-cd).*",
                    phase!="Succeeded"
                  }[10m]
                )
              )
            ) by (cluster, job, dest_server, project, name, phase) > 0
          for: 1m
          labels:
            severity: warning
            component: argocd
        - alert: ArgoCdAppUnhealthy
          annotations:
            description: "The application {{ $labels.dest_server }}/{{ $labels.project }}/{{ $labels.name }} is unhealthy with the health status {{ $labels.health_status }} for the past 15m."
            summary: "An ArgoCD Application is Unhealthy."
          expr: |
            sum(
              argocd_app_info{
                job=~"(argocd|argo-cd).*",
                health_status!~"Healthy|Progressing",
                name!~""
              }
            ) by (cluster, job, dest_server, project, name, health_status)
            > 0
          for: 15m
          labels:
            severity: warning
            component: argocd
        - alert: ArgoCdAppOutOfSync
          annotations:
            description: "The application {{ $labels.dest_server }}/{{ $labels.project }}/{{ $labels.name }} is out of sync with the sync status {{ $labels.sync_status }} for the past 15m."
            summary: "An ArgoCD Application is Out Of Sync."
          expr: |
            sum(
              argocd_app_info{
                job=~"(argocd|argo-cd).*",
                sync_status!="Synced"
              }
            ) by (cluster, job, dest_server, project, name, sync_status)
            > 0
          for: 15m
          labels:
            severity: warning
            component: argocd
        - alert: ArgoCdAppAutoSyncDisabled
          annotations:
            description: "The application {{ $labels.dest_server }}/{{ $labels.project }}/{{ $labels.name }} has autosync disabled for the past 2h."
            summary: "An ArgoCD Application has AutoSync Disabled."
          expr: |
            sum(
              argocd_app_info{
                job=~"(argocd|argo-cd).*",
                autosync_enabled!="true",
                name!~""
              }
            ) by (cluster, job, dest_server, project, name, autosync_enabled)
            > 0
          for: 2h
          labels:
            severity: warning
            component: argocd
        - alert: ArgoCdRolloutProgressing
          annotations:
            description: "The application {{ $labels.dest_server }}/{{ $labels.project }}/{{ $labels.name }} has been in a Progressing state for more than 30m."
            summary: "An ArgoCD Application Rollout is Progressing for too long."
          expr: |
            sum(
              argocd_app_info{
                job=~"(argocd|argo-cd).*",
                health_status="Progressing",
                name!~""
              }
            ) by (cluster, job, dest_server, project, name, health_status)
            > 0
          for: 30m
          labels:
            severity: warning
            component: argocd
        - alert: ArgoCdAppControllerHighReconciliationDuration
          annotations:
            description: "ArgoCD app controller in {{ $labels.namespace }} is taking more than 60s (0.95 percentile) to reconcile applications for the past 10m. This may indicate performance issues or the need to scale up."
            summary: "ArgoCD App Controller has high reconciliation duration."
          expr: |
            histogram_quantile(0.95,
              sum(
                rate(
                  argocd_app_reconcile_bucket{
                    job=~"(argocd|argo-cd).*"
                  }[2m]
                )
              ) by (cluster, namespace, le)
            ) > 60
          for: 10m
          labels:
            severity: warning
            component: argocd
        - alert: ArgoCdRepoServerPendingRequests
          annotations:
            description: "ArgoCD repo server in {{ $labels.namespace }} has 50 or more pending requests for the past 10m. The repo server may be overloaded and need scaling."
            summary: "ArgoCD Repo Server has pending requests."
          expr: |
            sum(
              argocd_repo_pending_request_total{
                job=~"(argocd|argo-cd).*"
              }
            ) by (cluster, namespace)
            > 50
          for: 10m
          labels:
            severity: warning
            component: argocd
        - alert: ArgoCdRepoServerHighGitRequestDuration
          annotations:
            description: "ArgoCD repo server in {{ $labels.namespace }} is experiencing git operations (fetch/clone) taking more than 30s (0.95 percentile) for the past 10m. This may indicate slow git repository access or network issues."
            summary: "ArgoCD Repo Server has high git request duration."
          expr: |
            histogram_quantile(0.95,
              sum(
                rate(
                  argocd_git_request_duration_seconds_bucket{
                    job=~"(argocd|argo-cd).*"
                  }[2m]
                )
              ) by (cluster, namespace, le)
            ) > 30
          for: 10m
          labels:
            severity: warning
            component: argocd
        - alert: ArgoCdClusterConnectionError
          annotations:
            description: "ArgoCD in {{ $labels.namespace }} cannot connect to cluster {{ $labels.server }} for the past 5m. Check cluster credentials and network connectivity."
            summary: "ArgoCD cannot connect to managed cluster."
          expr: |
            argocd_cluster_connection_status{
              job=~"(argocd|argo-cd).*"
            } < 1
          for: 5m
          labels:
            severity: critical
            component: argocd
        - alert: ArgoCdGitRequestErrors
          annotations:
            description: "ArgoCD in {{ $labels.namespace }} is experiencing git fetch failures for repository {{ $labels.repo }} for the past 5m. This may indicate repository access issues or network problems."
            summary: "ArgoCD Git requests are failing."
          expr: |
            sum(
              round(
                increase(
                  argocd_git_fetch_fail_total{
                    job=~"(argocd|argo-cd).*"
                  }[2m]
                )
              )
            ) by (cluster, namespace, repo) > 0
          for: 5m
          labels:
            severity: warning
            component: argocd
        - alert: ArgoCdHighKubectlRateLimiterDuration
          annotations:
            description: "ArgoCD in {{ $labels.namespace }} has a P0.95 kubectl rate limiter wait time above 1s for the past 10m. The Kubernetes API server may be throttling ArgoCD requests."
            summary: "ArgoCD kubectl rate limiter duration is high."
          expr: |
            histogram_quantile(0.95,
              sum(
                rate(
                  argocd_kubectl_rate_limiter_duration_seconds_bucket{
                    job=~"(argocd|argo-cd).*"
                  }[2m]
                )
              ) by (cluster, namespace, le)
            ) > 1
          for: 10m
          labels:
            severity: warning
            component: argocd
        - alert: ArgoCdHighKubectlRequestDuration
          annotations:
            description: "ArgoCD in {{ $labels.namespace }} has a P0.95 kubectl request duration above 5s for the past 10m. This may indicate Kubernetes API server performance issues."
            summary: "ArgoCD kubectl request duration is high."
          expr: |
            histogram_quantile(0.95,
              sum(
                rate(
                  argocd_kubectl_request_duration_seconds_bucket{
                    job=~"(argocd|argo-cd).*"
                  }[2m]
                )
              ) by (cluster, namespace, le)
            ) > 5
          for: 10m
          labels:
            severity: warning
            component: argocd
        - alert: ArgoCdHighKubectlRequestRetryRate
          annotations:
            description: "ArgoCD in {{ $labels.namespace }} has had more than 50 kubectl request retries per minute for the past 10m. This indicates transient Kubernetes API errors or throttling."
            summary: "ArgoCD kubectl request retry rate is high."
          expr: |
            sum(
              increase(
                argocd_kubectl_request_retries_total{
                  job=~"(argocd|argo-cd).*"
                }[1m]
              )
            ) by (cluster, namespace) > 50
          for: 10m
          labels:
            severity: warning
            component: argocd
        - alert: ArgoCdHighGrpcErrorRate
          annotations:
            description: "ArgoCD {{ $labels.job }} in {{ $labels.namespace }} has a gRPC error rate above 5% for the past 10m."
            summary: "ArgoCD gRPC error rate is high."
          expr: |
            sum(
              rate(
                grpc_server_handled_total{
                  job=~"(argocd|argo-cd).*",
                  grpc_code!="OK"
                }[2m]
              )
            ) by (cluster, namespace, job)
            /
            sum(
              rate(
                grpc_server_handled_total{
                  job=~"(argocd|argo-cd).*"
                }[2m]
              )
            ) by (cluster, namespace, job) * 100
            > 5
          for: 10m
          labels:
            severity: warning
            component: argocd
        - alert: ArgoCdHighKubectlPendingExec
          annotations:
            description: "ArgoCD in {{ $labels.namespace }} has more than 10 pending kubectl executions for the past 15m. This may indicate resource contention or slow manifest generation."
            summary: "ArgoCD has a high number of pending kubectl executions."
          expr: |
            sum(
              argocd_kubectl_exec_pending{
                job=~"(argocd|argo-cd).*"
              }
            ) by (cluster, namespace) > 10
          for: 15m
          labels:
            severity: warning
            component: argocd
