        - ports:
            - port: "11211"
              protocol: TCP
    # kube-prometheus-stack scraping the memcached exporter's /metrics (ServiceMonitor).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9150"
              protocol: TCP
---
