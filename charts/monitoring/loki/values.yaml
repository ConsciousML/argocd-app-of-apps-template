# Implemented monolithic deployment mode + HA + S3
# See https://grafana.com/docs/loki/latest/setup/install/helm/install-monolithic/

loki:
  # -- Monolithic mode, every Loki component in the `singleBinary` StatefulSet. The other modes' replicas are set to 0.
  # @section -- Deployment
  deploymentMode: Monolithic

  # Parallel pod management creates all 3 replicas at once on a fresh apply, so none is
  # Ready yet to appear in loki-memberlist's endpoints, deadlocking startup. This lets
  # not-yet-ready pods be discovered so they can join each other.
  memberlist:
    service:
      publishNotReadyAddresses: true

  # Scraped by kube-prometheus-stack (serviceMonitorSelectorNilUsesHelmValues: false picks up
  # any ServiceMonitor). rules/alerts are the chart's built-in Grafana Loki mixin recording
  # rules and alerts. component: loki drives Alertmanager's routing tree (see
  # helm-kube-prometheus-stack/values.yaml).
  # -- Enables the `ServiceMonitor` and the Loki mixin rules and alerts. Alerts carry `component: loki`, which Alertmanager routes on.
  # @section -- Monitoring
  # @default -- see values.yaml
  monitoring:
    serviceMonitor:
      enabled: true
    rules:
      enabled: true
    alerts:
      enabled: true
      additionalRuleLabels:
        component: loki

  loki:
    # Single-tenant per environment, disable multi-tenancy (chart default: true,
    # which rejects writes without an X-Scope-OrgID header, 401 "no org id").
    # -- Single tenant, so writes need no `X-Scope-OrgID` header.
    # @section -- Loki Config
    auth_enabled: false

    commonConfig:
      # -- Each log stream is written to 3 replicas.
      # @section -- Loki Config
      replication_factor: 3

    # Injected by the catalog (eks-forge-catalog) via appParams, from the
    # units/eks/addons/loki/s3 buckets and the EKS cluster's region. See
    # units/eks/addons/argocd/app_of_apps in that repo. No instance sets this itself.
    # -- S3 `chunks` and `ruler` bucket names and region. Injected by the catalog via `appParams`.
    # @section -- Loki Config
    # @default -- see values.yaml
    storage:
      bucketNames:
        chunks: ""
        ruler: ""
      s3:
        region: ""

    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

    pattern_ingester:
      enabled: true

    # -- 28-day retention, structured metadata, and the volume API.
    # @section -- Loki Config
    # @default -- see values.yaml
    limits_config:
      allow_structured_metadata: true
      volume_enabled: true
      retention_period: 672h # 28 days

    compactor:
      retention_enabled: true
      delete_request_store: s3

    rulerConfig:
      enable_api: true

  singleBinary:
    # -- `singleBinary` StatefulSet replicas.
    # @section -- Single Binary
    replicas: 3

    # AZ-level spread: a replica stuck Pending on DoNotSchedule doesn't drop the ring below
    # quorum, the other replicas keep serving.
    # -- Spreads replicas across AZs, `DoNotSchedule` when unsatisfiable.
    # @section -- Single Binary
    # @default -- see values.yaml
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/component: single-binary
            app.kubernetes.io/name: '{{ include "loki.name" . }}'
            app.kubernetes.io/instance: '{{ .Release.Name }}'

    # Keep a majority (2/3) up during voluntary disruption, matching the ring's write quorum.
    podDisruptionBudget:
      # -- Keeps a majority up during voluntary disruption.
      # @section -- Single Binary
      minAvailable: 2

    # CPU sized to observed steady-state WAL checkpoint load (~1.1-1.2 cores per pod).
    # -- Resource requests and limits. The caches, the gateway, the canary, and the sidecar set their own.
    # @section -- Single Binary
    # @default -- see values.yaml
    resources:
      requests:
        cpu: 1737m
        memory: 324M
      limits:
        cpu: 1737m
        memory: 324M
    # -- Pins pods to the `critical` NodePool, with a matching `tolerations` entry. The caches and the gateway set the same.
    # @section -- Single Binary
    # @default -- see values.yaml
    nodeSelector:
      karpenter.sh/nodepool: critical
    tolerations:
      - key: karpenter.sh/workload-class
        operator: Equal
        value: critical
        effect: NoSchedule
    persistence:
      # -- PVC size per replica. PVC deletion is set per environment in `values-<env>.yaml`.
      # @section -- Single Binary
      size: 30Gi

  # Right-sized from observed usage (chart default 8192, ~9.6Gi pod memory, is oversized
  # here). Same across environments. Monitor query latency and S3 GET cost. Bump if needed.
  # https://grafana.com/docs/loki/latest/operations/caching/
  chunksCache:
    # -- Chunks cache memory in MB, below the chart default of 8192.
    # @section -- Caches
    allocatedMemory: 1024
    resources:
      requests:
        cpu: 11m
        memory: 64M
      limits:
        cpu: 55m
        memory: 64M
    nodeSelector:
      karpenter.sh/nodepool: critical
    tolerations:
      - key: karpenter.sh/workload-class
        operator: Equal
        value: critical
        effect: NoSchedule

  resultsCache:
    resources:
      requests:
        cpu: 11m
        memory: 24M
      limits:
        cpu: 55m
        memory: 24M
    nodeSelector:
      karpenter.sh/nodepool: critical
    tolerations:
      - key: karpenter.sh/workload-class
        operator: Equal
        value: critical
        effect: NoSchedule

  # Shared by the exporter container in both chunksCache and resultsCache pods, the chart
  # has no per-cache override for it.
  memcachedExporter:
    resources:
      requests:
        cpu: 11m
        memory: 21M
      limits:
        cpu: 55m
        memory: 21M

  gateway:
    resources:
      requests:
        cpu: 11m
        memory: 24M
      limits:
        cpu: 55m
        memory: 24M
    metrics:
      resources:
        requests:
          cpu: 11m
          memory: 24M
        limits:
          cpu: 55m
          memory: 24M
    nodeSelector:
      karpenter.sh/nodepool: critical
    tolerations:
      - key: karpenter.sh/workload-class
        operator: Equal
        value: critical
        effect: NoSchedule

  # DaemonSet, one pod per node (chart default kind): needs to verify log delivery from every
  # node regardless of pool, so it tolerates both taints instead of pinning via nodeSelector.
  # Karpenter only accounts for a DaemonSet's overhead when a node is first launched, so a
  # DaemonSet pod that needs to land on an already-full node (e.g. added after the node was
  # provisioned) would otherwise stay Pending indefinitely: Karpenter won't scale up for a lone
  # DaemonSet pod on its own. daemonset-critical (see priority-classes/) lets it preempt
  # a lower-priority pod instead, which turns into a new pending pod that Karpenter will scale
  # up for, without being able to preempt cluster-critical controllers like Karpenter itself or
  # the ArgoCD application-controller to do it.
  lokiCanary:
    # -- Lets a canary pod preempt a lower-priority one on a full node. It tolerates both Karpenter NodePool taints and the MNG taint, so every node runs one.
    # @section -- Canary
    priorityClassName: daemonset-critical
    resources:
      requests:
        cpu: 11m
        memory: 24M
      limits:
        cpu: 11m
        memory: 24M
    tolerations:
      - key: karpenter.sh/workload-class
        operator: Exists
        effect: NoSchedule
      - key: node-role/mng
        operator: Equal
        value: "true"
        effect: NoSchedule

  sidecar:
    resources:
      requests:
        cpu: 50m
        memory: 249M
      limits:
        memory: 249M

  # Other deployment modes, unused in Monolithic mode. Some (write/read/backend) default to
  # replicas: 3 regardless of deploymentMode, and the chart refuses to render if both
  # singleBinary and any of these are non-zero at once.
  write:
    replicas: 0
  read:
    replicas: 0
  backend:
    replicas: 0
  ingester:
    replicas: 0
  querier:
    replicas: 0
  queryFrontend:
    replicas: 0
  queryScheduler:
    replicas: 0
  distributor:
    replicas: 0
  compactor:
    replicas: 0
  indexGateway:
    replicas: 0
  bloomPlanner:
    replicas: 0
  bloomBuilder:
    replicas: 0
  bloomGateway:
    replicas: 0

  minio:
    # -- Disabled, storage is S3.
    # @section -- Deployment
    enabled: false
