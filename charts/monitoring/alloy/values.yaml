# Pod logs and Kubernetes events are collected via the Kubernetes API (not by
# reading files off disk). See:
# https://grafana.com/docs/alloy/latest/collect/logs-in-kubernetes/

alloy:
  alloy:
    # -- Resource requests and limits.
    # @section -- Alloy
    # @default -- see values.yaml
    resources:
      requests:
        cpu: 11m
        memory: 94M
      limits:
        memory: 94M
    # -- Alloy pipeline. Collects this node's pod logs and the cluster's events via the Kubernetes API, and pushes both to `loki-gateway`.
    # @section -- Alloy
    # @default -- see values.yaml
    configMap:
      content: |
        // Restrict to pods on the same node as this Alloy instance:
        //https://grafana.com/docs/alloy/latest/reference/components/discovery/discovery.kubernetes/#limit-to-only-pods-on-the-same-node
        discovery.kubernetes "pod" {
          role = "pod"
          selectors {
            role  = "pod"
            field = "spec.nodeName=" + coalesce(sys.env("HOSTNAME"), constants.hostname)
          }
        }

        // Labels kept to namespace/pod/container/app/job/container_runtime: low
        // cardinality, following best practices:
        // https://grafana.com/docs/loki/latest/get-started/labels/bp-labels/
        //
        // To learn more about labels:
        // https://grafana.com/docs/loki/latest/get-started/labels/
        discovery.relabel "pod_logs" {
          targets = discovery.kubernetes.pod.targets

          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            action        = "replace"
            target_label  = "namespace"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            action        = "replace"
            target_label  = "pod"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            action        = "replace"
            target_label  = "container"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
            action        = "replace"
            target_label  = "app"
          }

          rule {
            source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
            action        = "replace"
            target_label  = "job"
            separator     = "/"
            replacement   = "$1"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_container_id"]
            action        = "replace"
            target_label  = "container_runtime"
            regex         = `^(\S+):\/\/.+$`
            replacement   = "$1"
          }
        }

        loki.source.kubernetes "pod_logs" {
          targets    = discovery.relabel.pod_logs.output
          forward_to = [loki.write.default.receiver]
        }

        loki.source.kubernetes_events "cluster_events" {
          job_name   = "integrations/kubernetes/eventhandler"
          log_format = "logfmt"
          forward_to = [loki.process.cluster_events.receiver]
        }

        // "job" is already a target label (from job_name above) and target labels
        // are auto-added to the extracted map, so this copies it into a new label
        // named kubernetes_cluster_events, distinguishing event streams from the
        // "job" label pod-log streams use (namespace/container, set above).
        loki.process "cluster_events" {
          forward_to = [loki.write.default.receiver]

          stage.labels {
            values = {
              kubernetes_cluster_events = "job",
            }
          }
        }

        loki.write "default" {
          endpoint {
            url = "http://loki-gateway.loki.svc.cluster.local:80/loki/api/v1/push"
          }
        }

    # UID/GID 473 matches the chart's own ci/nonroot-values.yaml fixture for the
    # image's built-in non-root user.
    # -- Runs as non-root UID and GID 473 with a read-only root filesystem.
    # @section -- Alloy
    # @default -- see values.yaml
    securityContext:
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 473
      runAsGroup: 473
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]

    # No volume is mounted at alloy.storagePath (/tmp/alloy, the WAL/positions dir) by
    # default, so it needs one for the container to run with readOnlyRootFilesystem above.
    # -- Mounts the `alloy-data` `emptyDir` (see `controller.volumes.extra`) at `/tmp/alloy`, the storage path.
    # @section -- Alloy
    # @default -- see values.yaml
    mounts:
      extra:
        - name: alloy-data
          mountPath: /tmp/alloy

  # -- Config reloader sidecar resources, and a non-root `securityContext` (UID and GID 65534).
  # @section -- Config Reloader
    # @default -- see values.yaml
  configReloader:
    resources:
      requests:
        cpu: 11m
        memory: 12M
      limits:
        cpu: 11m
        memory: 12M
    securityContext:
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      # Image's default user is the non-numeric "nobody", which Kubernetes can't verify
      # as non-root on its own (fails with "cannot verify user is non-root"). 65534 is
      # nobody's conventional UID/GID.
      runAsUser: 65534
      runAsGroup: 65534
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]

  global:
    # Pod-level securityContext (rendered from global, not controller, despite living
    # alongside the DaemonSet spec).
    # -- Pod-level `runAsNonRoot`, and `fsGroup` 473 so `alloy-data` is writable.
    # @section -- DaemonSet
    # @default -- see values.yaml
    podSecurityContext:
      fsGroup: 473 # so the alloy-data emptyDir below is writable by the runAsUser above
      runAsNonRoot: true # container-level runAsNonRoot alone doesn't satisfy the pod-level check

  controller:
    # -- One Alloy pod per node.
    # @section -- DaemonSet
    type: daemonset # chart default, kept explicit: log collection needs one Alloy per node
    # Karpenter only accounts for a DaemonSet's overhead when a node is first launched, so a
    # DaemonSet pod that needs to land on an already-full node would otherwise stay Pending
    # indefinitely. daemonset-critical (see priority-classes/) lets it preempt a
    # lower-priority pod instead, which turns into a new pending pod that Karpenter will scale
    # up for, without being able to preempt cluster-critical controllers like Karpenter itself
    # or the ArgoCD application-controller to do it.
    # -- Lets a pod preempt a lower-priority one on a full node.
    # @section -- DaemonSet
    priorityClassName: daemonset-critical
    # -- The `alloy-data` `emptyDir`.
    # @section -- DaemonSet
    # @default -- see values.yaml
    volumes:
      extra:
        - name: alloy-data
          emptyDir: {}
    # -- Tolerates both Karpenter NodePool taints and the MNG taint, so every node runs a pod.
    # @section -- DaemonSet
    # @default -- see values.yaml
    tolerations:
      - key: karpenter.sh/workload-class
        operator: Exists
        effect: NoSchedule
      # Both Karpenter NodePools carry this taint (see units/eks/addons/karpenter/node_pool
      # in the catalog repo). Without it, Alloy won't schedule onto Karpenter nodes and
      # their pod logs would go uncollected.
      - key: node-role/mng
        operator: Equal
        value: "true"
        effect: NoSchedule
      # The MNG carries this taint (see eks_managed_node_groups in the catalog repo's
      # pipelines/dev/eks/stack/terragrunt.stack.hcl). Without it, Alloy won't schedule
      # onto MNG nodes and their pod logs would go uncollected.
