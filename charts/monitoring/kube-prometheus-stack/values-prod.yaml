# Retains Prometheus and Alertmanager PVCs on StatefulSet delete, unlike dev and staging.

kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      persistentVolumeClaimRetentionPolicy:
        whenDeleted: Retain
        whenScaled: Retain

  alertmanager:
    alertmanagerSpec:
      persistentVolumeClaimRetentionPolicy:
        whenDeleted: Retain
        whenScaled: Retain
