apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: operator
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kube-prometheus-stack-prometheus-operator
  ingress:
    # kubelet liveness/readiness probes (/healthz), sourced from the node.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
    # kube-apiserver calling the PrometheusRule/AlertmanagerConfig admission webhooks.
    - fromEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
    # kube-prometheus-stack scraping /metrics over TLS (ServiceMonitor, port https).
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
