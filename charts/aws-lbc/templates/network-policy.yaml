apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: aws-load-balancer-controller
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: aws-load-balancer-controller
  ingress:
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "61779"
              protocol: TCP
    # Admission webhook, called by kube-apiserver on Ingress/Gateway create and update.
    - fromEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    # ELBv2 and EC2 API, reached via NAT as `world`.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
