# Injected by the catalog (terragrunt-template-catalog-eks) via appParams, pinned VPC
# interface endpoint IPs. See units/eks/addons/argocd/app_of_apps in that repo.
vpcEndpointCidrs:
  ec2: []
  elasticloadbalancing: []
  tagging: []
  shield: []
  acm: []

aws-load-balancer-controller:
  # Injected by the catalog (terragrunt-template-catalog-eks) via appParams, from the EKS
  # cluster name, region, and VPC ID. See units/eks/addons/argocd/app_of_apps in that repo.
  clusterName: ""
  region: ""
  vpcId: ""
  enableServiceMutatorWebhook: false
  serviceMonitor:
    enabled: true
  nodeSelector:
    karpenter.sh/nodepool: elastic
  tolerations:
    - key: karpenter.sh/workload-class
      operator: Equal
      value: elastic
      effect: NoSchedule
  resources:
    requests:
      cpu: 15m
      memory: 100Mi
    limits:
      cpu: 15m
      memory: 100Mi
