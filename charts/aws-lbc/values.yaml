# -- VPC interface endpoint IPs (`ec2`, `elasticloadbalancing`, `tagging`, `shield`, `acm`) the network policy allows egress to. Injected by the catalog via `appParams`.
# @section -- Network Policy
# @default -- see values.yaml
vpcEndpointCidrs:
  ec2: []
  elasticloadbalancing: []
  tagging: []
  shield: []
  acm: []

aws-load-balancer-controller:
  # -- EKS cluster name. Injected by the catalog via `appParams`.
  # @section -- AWS Load Balancer Controller
  clusterName: ""
  # -- AWS region. Injected by the catalog via `appParams`.
  # @section -- AWS Load Balancer Controller
  region: ""
  # -- VPC ID. Injected by the catalog via `appParams`.
  # @section -- AWS Load Balancer Controller
  vpcId: ""
  # -- Disables the webhook that mutates `Service` resources of type `LoadBalancer`.
  # @section -- AWS Load Balancer Controller
  enableServiceMutatorWebhook: false
  # -- Enables the Prometheus `ServiceMonitor`.
  # @section -- AWS Load Balancer Controller
  serviceMonitor:
    enabled: true
  # -- Pins pods to the `elastic` NodePool, with a matching `tolerations` entry.
  # @section -- Scheduling
  # @default -- see values.yaml
  nodeSelector:
    karpenter.sh/nodepool: elastic
  tolerations:
    - key: karpenter.sh/workload-class
      operator: Equal
      value: elastic
      effect: NoSchedule
  # -- Resource requests and limits.
  # @section -- Scheduling
  # @default -- see values.yaml
  resources:
    requests:
      cpu: 15m
      memory: 100Mi
    limits:
      cpu: 15m
      memory: 100Mi
