goldilocks:
  # VPA (recommender only) is installed separately by helm-vpa.
  vpa:
    # -- Disabled, VPA is the separate [`vpa`](../vpa) chart.
    # @section -- Disabled Components
    enabled: false
  # Provisioned as the EKS-managed metrics-server addon (eks-forge-catalog),
  # not by this chart.
  metrics-server:
    # -- Disabled, metrics-server is the EKS addon instead.
    # @section -- Disabled Components
    enabled: false
  controller:
    flags:
      # -- Creates a VPA for every workload in every namespace, no namespace label needed.
      # @section -- Controller
      on-by-default: "true"
    # -- Resource requests and limits.
    # @section -- Controller
    # @default -- see values.yaml
    resources:
      requests:
        cpu: 15m
        memory: 105M
      limits:
        cpu: 15m
        memory: 105M
    # -- Pins the controller to the `elastic` NodePool, with a matching `tolerations` entry.
    # @section -- Controller
    # @default -- see values.yaml
    nodeSelector:
      karpenter.sh/nodepool: elastic
    tolerations:
      - key: karpenter.sh/workload-class
        operator: Equal
        value: elastic
        effect: NoSchedule
    rbac:
      # Without this, the controller can't walk the owner chain from an alertmanager-*/
      # prometheus-* pod to its Prometheus Operator CR, and logs a "forbidden" error on
      # every reconcile (VPAs still get created via fallback, but the top-level-owner
      # lookup fails).
      # -- Read access to `alertmanagers` and `prometheuses` (`monitoring.coreos.com`).
      # @section -- Controller
      # @default -- see values.yaml
      extraRules:
        - apiGroups:
            - 'monitoring.coreos.com'
          resources:
            - 'alertmanagers'
            - 'prometheuses'
          verbs:
            - 'get'
            - 'list'
            - 'watch'
  dashboard:
    enabled: true
    # Separate flag from controller.flags above, also needed for the dashboard to list
    # every namespace instead of only labeled ones.
    flags:
      # -- Lists every namespace, not only labeled ones.
      # @section -- Dashboard
      on-by-default: "true"
    # -- Resource requests and limits.
    # @section -- Dashboard
    # @default -- see values.yaml
    resources:
      requests:
        cpu: 15m
        memory: 105M
      limits:
        cpu: 75m
        memory: 105M
    # -- Pins the dashboard to the `elastic` NodePool, with a matching `tolerations` entry.
    # @section -- Dashboard
    # @default -- see values.yaml
    nodeSelector:
      karpenter.sh/nodepool: elastic
    tolerations:
      - key: karpenter.sh/workload-class
        operator: Equal
        value: elastic
        effect: NoSchedule
