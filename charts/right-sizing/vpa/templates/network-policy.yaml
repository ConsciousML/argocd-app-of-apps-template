apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vpa-recommender
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vpa
      app.kubernetes.io/component: recommender
  ingress:
    # Kubelet liveness and readiness probes.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8942"
              protocol: TCP
    # kube-prometheus-stack scraping /metrics (PodMonitor).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8942"
              protocol: TCP
  egress:
    # --storage=prometheus history backfill, see values.yaml extraArgs.prometheus-address.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
