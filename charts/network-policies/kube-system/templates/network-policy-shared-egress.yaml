apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kube-system-shared-egress
  namespace: kube-system
spec:
  endpointSelector: {}
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # EKS Pod Identity credential endpoint, a host-owned address Cilium resolves to the
    # reserved "host" identity. Granted here rather than relying on the cluster-wide
    # eks-pod-identity-egress CCNP, which depends on this app already existing and so can
    # never land before it.
    - toEntities:
        - host
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
