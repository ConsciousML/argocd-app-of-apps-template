apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hubble-relay
  namespace: kube-system
spec:
  endpointSelector:
    matchLabels:
      k8s-app: hubble-relay
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s-app: hubble-ui
      toPorts:
        - ports:
            - port: "4245"
              protocol: TCP
    # `hubble observe` via kubectl port-forward, used directly by operators.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "4245"
              protocol: TCP
  egress:
    # cilium-agent's hubble-peer port. Agents are hostNetwork, so this resolves to
    # host/remote-node rather than a pod endpoint.
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "4244"
              protocol: TCP
