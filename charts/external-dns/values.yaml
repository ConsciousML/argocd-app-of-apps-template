# Injected by the catalog (terragrunt-template-catalog-eks) via appParams, pinned VPC
# interface endpoint IPs. See units/eks/addons/argocd/app_of_apps in that repo.
vpcEndpointCidrs:
  route53: []

external-dns:
  provider:
    name: aws
  # txtOwnerId, txtPrefix, and domainFilters are overridden per instance at sync time by the
  # catalog's app_of_apps unit via appParams.
  txtOwnerId: ""
  txtPrefix: ""
  domainFilters: []
  triggerLoopOnEvent: true
  sources:
    - service
    - ingress
    - gateway-httproute
  registry: txt
  policy: sync
  logLevel: info
  serviceMonitor:
    enabled: true
  # annotationFilter, extraArgs.aws-zone-type, and serviceAccount.name are overridden per
  # instance (private/public) via extraValueFiles in apps/values.yaml.
  annotationFilter: ""
  extraArgs:
    aws-zone-type: ""
  serviceAccount:
    name: ""
  resources:
    requests:
      cpu: 11m
      memory: 36M
    limits:
      cpu: 11m
      memory: 36M
  nodeSelector:
    karpenter.sh/nodepool: elastic
  tolerations:
    - key: karpenter.sh/workload-class
      operator: Equal
      value: elastic
      effect: NoSchedule
