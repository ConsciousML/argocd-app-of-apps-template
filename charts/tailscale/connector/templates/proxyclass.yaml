apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: elastic-nodepool
spec:
  statefulSet:
    pod:
      nodeSelector:
        karpenter.sh/nodepool: elastic
      tolerations:
        - key: karpenter.sh/workload-class
          operator: Equal
          value: elastic
          effect: NoSchedule
      tailscaleContainer:
        resources:
          requests:
            cpu: 15m
            memory: 105M
          limits:
            memory: 105M
