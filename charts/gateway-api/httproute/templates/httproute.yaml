apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.name | quote }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name | quote }}
      namespace: {{ .Values.gateway.namespace | quote }}
      sectionName: http
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name | quote }}
      namespace: {{ .Values.gateway.namespace | quote }}
      sectionName: https
  hostnames:
    - {{ .Values.host | quote }}
  rules:
    {{- range .Values.rules }}
    - matches:
        {{- toYaml .matches | nindent 8 }}
      backendRefs:
        - name: {{ (index $.Values.backendRefs .backendRefKey).name | quote }}
          port: {{ (index $.Values.backendRefs .backendRefKey).port }}
    {{- end }}
