# Implemented monolithic deployment mode + HA + S3
# See https://grafana.com/docs/loki/latest/setup/install/helm/install-monolithic/

loki:
  deploymentMode: Monolithic

  loki:
    # Single-tenant per environment, disable multi-tenancy (chart default: true,
    # which rejects writes without an X-Scope-OrgID header, 401 "no org id").
    auth_enabled: false

    commonConfig:
      replication_factor: 3

    # Injected by the catalog (terragrunt-template-catalog-eks) via appParams, from the
    # units/eks/addons/loki/s3 buckets and the EKS cluster's region. See
    # units/eks/addons/argocd/app_of_apps in that repo. No instance sets this itself.
    storage:
      bucketNames:
        chunks: ""
        ruler: ""
      s3:
        region: ""

    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

    pattern_ingester:
      enabled: true

    limits_config:
      allow_structured_metadata: true
      volume_enabled: true
      retention_period: 672h # 28 days

    compactor:
      retention_enabled: true
      delete_request_store: s3

    rulerConfig:
      enable_api: true

  singleBinary:
    replicas: 3
    persistence:
      size: 30Gi
      # Reclaim volumes on dev for cost savings, do not enable this on prod
      enableStatefulSetAutoDeletePVC: true

  # Chart default (8192, ~9.6Gi pod memory) is sized for a large production cluster and
  # doesn't fit this dev cluster's nodes. 
  # If queries are slow or S3 GET cost increases, bumping the RAM
  # Otherwise read the following to speed up queries:
  # https://grafana.com/docs/loki/latest/operations/caching/
  chunksCache:
    allocatedMemory: 1024

  # Other deployment modes, unused in Monolithic mode. Some (write/read/backend) default to
  # replicas: 3 regardless of deploymentMode, and the chart refuses to render if both
  # singleBinary and any of these are non-zero at once.
  write:
    replicas: 0
  read:
    replicas: 0
  backend:
    replicas: 0
  ingester:
    replicas: 0
  querier:
    replicas: 0
  queryFrontend:
    replicas: 0
  queryScheduler:
    replicas: 0
  distributor:
    replicas: 0
  compactor:
    replicas: 0
  indexGateway:
    replicas: 0
  bloomPlanner:
    replicas: 0
  bloomBuilder:
    replicas: 0
  bloomGateway:
    replicas: 0

  minio:
    enabled: false
