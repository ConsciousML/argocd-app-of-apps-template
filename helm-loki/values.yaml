# Implemented monolithic deployment mode + HA + S3
# See https://grafana.com/docs/loki/latest/setup/install/helm/install-monolithic/

loki:
  deploymentMode: Monolithic

  # Scraped by kube-prometheus-stack (serviceMonitorSelectorNilUsesHelmValues: false picks up
  # any ServiceMonitor). rules/alerts are the chart's built-in Grafana Loki mixin recording
  # rules and alerts. component: loki drives Alertmanager's routing tree (see
  # helm-kube-prometheus-stack/values.yaml).
  monitoring:
    serviceMonitor:
      enabled: true
    rules:
      enabled: true
    alerts:
      enabled: true
      additionalRuleLabels:
        component: loki

  loki:
    # Single-tenant per environment, disable multi-tenancy (chart default: true,
    # which rejects writes without an X-Scope-OrgID header, 401 "no org id").
    auth_enabled: false

    commonConfig:
      replication_factor: 3

    # Injected by the catalog (terragrunt-template-catalog-eks) via appParams, from the
    # units/eks/addons/loki/s3 buckets and the EKS cluster's region. See
    # units/eks/addons/argocd/app_of_apps in that repo. No instance sets this itself.
    storage:
      bucketNames:
        chunks: ""
        ruler: ""
      s3:
        region: ""

    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

    pattern_ingester:
      enabled: true

    limits_config:
      allow_structured_metadata: true
      volume_enabled: true
      retention_period: 672h # 28 days

    compactor:
      retention_enabled: true
      delete_request_store: s3

    rulerConfig:
      enable_api: true

  singleBinary:
    replicas: 3
    # Memory guaranteed (limit = request) based on observed steady-state usage of 195-249Mi
    # per pod, well under the request below.
    resources:
      requests:
        cpu: 93m
        memory: 164M
      limits:
        memory: 164M
    nodeSelector:
      karpenter.sh/nodepool: critical
    tolerations:
      - key: karpenter.sh/workload-class
        operator: Equal
        value: critical
        effect: NoSchedule
    persistence:
      size: 30Gi
      # DEV: reclaim volumes for cost savings, do not enable this on prod. See
      # https://github.com/ConsciousML/terragrunt-template-live-eks/issues/38 for details.
      enableStatefulSetAutoDeletePVC: true

  # Chart default (8192, ~9.6Gi pod memory) is sized for a large production cluster and
  # doesn't fit this dev cluster's nodes, tune for prod.
  # If queries are slow or S3 GET cost increases, bumping the RAM
  # Otherwise read the following to speed up queries:
  # https://grafana.com/docs/loki/latest/operations/caching/
  chunksCache:
    allocatedMemory: 1024
    resources:
      requests:
        cpu: 11m
        memory: 64M
      limits:
        cpu: 55m
        memory: 64M
    nodeSelector:
      karpenter.sh/nodepool: critical
    tolerations:
      - key: karpenter.sh/workload-class
        operator: Equal
        value: critical
        effect: NoSchedule

  resultsCache:
    resources:
      requests:
        cpu: 11m
        memory: 24M
      limits:
        cpu: 55m
        memory: 24M
    nodeSelector:
      karpenter.sh/nodepool: critical
    tolerations:
      - key: karpenter.sh/workload-class
        operator: Equal
        value: critical
        effect: NoSchedule

  # Shared by the exporter container in both chunksCache and resultsCache pods, the chart
  # has no per-cache override for it.
  memcachedExporter:
    resources:
      requests:
        cpu: 11m
        memory: 21M
      limits:
        cpu: 55m
        memory: 21M

  gateway:
    resources:
      requests:
        cpu: 11m
        memory: 24M
      limits:
        cpu: 55m
        memory: 24M
    metrics:
      resources:
        requests:
          cpu: 11m
          memory: 24M
        limits:
          cpu: 55m
          memory: 24M
    nodeSelector:
      karpenter.sh/nodepool: critical
    tolerations:
      - key: karpenter.sh/workload-class
        operator: Equal
        value: critical
        effect: NoSchedule

  # DaemonSet, one pod per node (chart default kind): needs to verify log delivery from every
  # node regardless of pool, so it tolerates both taints instead of pinning via nodeSelector.
  # Karpenter only accounts for a DaemonSet's overhead when a node is first launched, so a
  # DaemonSet pod that needs to land on an already-full node (e.g. added after the node was
  # provisioned) would otherwise stay Pending indefinitely: Karpenter won't scale up for a lone
  # DaemonSet pod on its own. daemonset-critical (see priority-classes/) lets it preempt
  # a lower-priority pod instead, which turns into a new pending pod that Karpenter will scale
  # up for, without being able to preempt cluster-critical controllers like Karpenter itself or
  # the ArgoCD application-controller to do it.
  lokiCanary:
    priorityClassName: daemonset-critical
    resources:
      requests:
        cpu: 11m
        memory: 24M
      limits:
        cpu: 11m
        memory: 24M
    tolerations:
      - key: karpenter.sh/workload-class
        operator: Exists
        effect: NoSchedule
      - key: node-role/mng
        operator: Equal
        value: "true"
        effect: NoSchedule

  sidecar:
    resources:
      requests:
        cpu: 11m
        memory: 94M
      limits:
        memory: 94M

  # Other deployment modes, unused in Monolithic mode. Some (write/read/backend) default to
  # replicas: 3 regardless of deploymentMode, and the chart refuses to render if both
  # singleBinary and any of these are non-zero at once.
  write:
    replicas: 0
  read:
    replicas: 0
  backend:
    replicas: 0
  ingester:
    replicas: 0
  querier:
    replicas: 0
  queryFrontend:
    replicas: 0
  queryScheduler:
    replicas: 0
  distributor:
    replicas: 0
  compactor:
    replicas: 0
  indexGateway:
    replicas: 0
  bloomPlanner:
    replicas: 0
  bloomBuilder:
    replicas: 0
  bloomGateway:
    replicas: 0

  minio:
    enabled: false
