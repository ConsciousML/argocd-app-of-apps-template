apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-apps
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  project: default
  source:
    path: apps
    repoURL: https://github.com/ConsciousML/argocd-app-of-apps-template
    targetRevision: main
  syncPolicy:
    syncOptions:
        - CreateNamespace=true
    automated:
      prune: true