apiVersion: v1
kind: Namespace
metadata:
  name: tailscale
  labels:
    # The proxy pod the Tailscale operator creates for the Connector subnet router defaults
    # to privileged (NET_ADMIN), baseline would reject it.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
