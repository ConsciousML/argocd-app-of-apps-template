apiVersion: v1
kind: Service
metadata:
  name: argocd-server-grpc
  annotations:
    alb.ingress.kubernetes.io/backend-protocol-version: GRPC
spec:
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
    - name: https
      protocol: TCP
      port: 443
      targetPort: 8080
  selector:
    app.kubernetes.io/name: argocd-server
    app.kubernetes.io/instance: argocd
