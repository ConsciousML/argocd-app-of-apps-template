goldilocks:
  # VPA (recommender only) is installed separately by helm-vpa.
  vpa:
    enabled: false
  # Provisioned as the EKS-managed metrics-server addon (terragrunt-template-catalog-eks),
  # not by this chart.
  metrics-server:
    enabled: false
  controller:
    flags:
      on-by-default: "true"
    resources:
      requests:
        cpu: 93m
        memory: 100Mi
      limits:
        cpu: 93m
        memory: 100Mi
    nodeSelector:
      karpenter.sh/nodepool: elastic
    tolerations:
      - key: karpenter.sh/workload-class
        operator: Equal
        value: elastic
        effect: NoSchedule
  dashboard:
    enabled: true
    # Separate flag from controller.flags above, also needed for the dashboard to list
    # every namespace instead of only labeled ones.
    flags:
      on-by-default: "true"
    resources:
      requests:
        cpu: 15m
        memory: 100Mi
      limits:
        cpu: 75m
        memory: 100Mi
    nodeSelector:
      karpenter.sh/nodepool: elastic
    tolerations:
      - key: karpenter.sh/workload-class
        operator: Equal
        value: elastic
        effect: NoSchedule
